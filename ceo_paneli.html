<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#060912" />
  <title>Yönetici Özeti — Net Gelir Kasası &amp; Google Play</title>
  <style>
    :root {
      --bg: #060912;
      --bg-glow-1: rgba(16, 185, 129, 0.11);
      --bg-glow-2: rgba(56, 189, 248, 0.09);
      --card: rgba(13, 20, 38, 0.88);
      --card-inner: rgba(20, 30, 54, 0.72);
      --border: rgba(148, 163, 184, 0.14);
      --border-strong: rgba(16, 185, 129, 0.32);
      --text: #f8fafc;
      --muted: #94a3b8;
      --emerald: #10b981;
      --emerald-soft: rgba(16, 185, 129, 0.14);
      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.15);
      --blue: #38bdf8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 12% 8%, var(--bg-glow-1), transparent 42%),
        radial-gradient(circle at 88% 14%, var(--bg-glow-2), transparent 40%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 28px 18px 48px;
    }

    .shell {
      max-width: 960px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 14px var(--emerald);
    }

    .brand h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .meta-pill {
      font-size: 0.82rem;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border);
      padding: 7px 13px;
      border-radius: 999px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 22px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px;
      backdrop-filter: blur(14px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.42);
    }

    .card-vault {
      border-color: var(--border-strong);
    }

    .card-label {
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .hero-total {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .hero-try {
      font-size: clamp(2.35rem, 6vw, 3.4rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
      line-height: 1.05;
    }

    .hero-usd {
      font-size: clamp(1.25rem, 3.2vw, 1.7rem);
      font-weight: 700;
      color: var(--emerald);
    }

    .period-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .period-box {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 20px;
    }

    .period-title {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .period-try {
      font-size: 1.45rem;
      font-weight: 750;
      letter-spacing: -0.02em;
      margin-bottom: 3px;
    }

    .period-usd {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--emerald);
    }

    .sources-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .source-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      background: rgba(15, 23, 42, 0.62);
      border: 1px solid var(--border);
      border-radius: 15px;
    }

    .source-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .source-name {
      font-size: 0.98rem;
      font-weight: 650;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 650;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .badge-live {
      background: var(--emerald-soft);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .badge-waiting {
      background: var(--amber-soft);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.32);
    }

    .source-right {
      text-align: right;
    }

    .source-try {
      font-size: 1.02rem;
      font-weight: 700;
    }

    .source-usd {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .games-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .game-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
      padding: 20px 22px;
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    .game-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 220px;
      flex: 1;
    }

    .game-header {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .game-title {
      font-size: 1.2rem;
      font-weight: 750;
    }

    .version-chip {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--blue);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.28);
      padding: 3px 9px;
      border-radius: 999px;
    }

    .game-perf {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .play-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #04130d;
      font-weight: 750;
      font-size: 0.94rem;
      padding: 13px 22px;
      border-radius: 14px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.25);
      white-space: nowrap;
    }

    .play-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(16, 185, 129, 0.36);
    }

    /* PIN Kilit Ekranı */
    .pin-overlay {
      position: fixed;
      inset: 0;
      background: rgba(6, 9, 18, 0.96);
      backdrop-filter: blur(18px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }

    .pin-overlay.visible {
      display: flex;
    }

    .pin-card {
      width: 100%;
      max-width: 360px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 26px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }

    .pin-card h2 {
      font-size: 1.2rem;
      margin-bottom: 8px;
    }

    .pin-card p {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .pin-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.35em;
      text-align: center;
      padding: 14px;
      outline: none;
      margin-bottom: 14px;
    }

    .pin-input:focus {
      border-color: var(--emerald);
    }

    .pin-submit {
      width: 100%;
      border: none;
      cursor: pointer;
      background: var(--emerald);
      color: #04130d;
      font-weight: 750;
      font-size: 0.96rem;
      padding: 13px;
      border-radius: 14px;
    }

    .pin-error {
      margin-top: 12px;
      font-size: 0.84rem;
      color: var(--danger);
      min-height: 1.1em;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      body {
        padding: 18px 12px 36px;
      }
      .card {
        padding: 20px 18px;
        border-radius: 20px;
      }
      .period-row {
        grid-template-columns: 1fr;
      }
      .play-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="pinOverlay" class="pin-overlay" role="dialog" aria-modal="true" aria-labelledby="pinTitle">
    <form id="pinForm" class="pin-card" autocomplete="off">
      <h2 id="pinTitle">CEO Paneli Kilidi</h2>
      <p>Devam etmek için 4–6 haneli yönetici PIN kodunu girin.</p>
      <input
        id="pinInput"
        class="pin-input"
        type="password"
        inputmode="numeric"
        minlength="4"
        maxlength="6"
        placeholder="••••"
        required
      />
      <button type="submit" class="pin-submit">Paneli Aç</button>
      <div id="pinError" class="pin-error"></div>
    </form>
  </div>

  <main id="dashboardShell" class="shell hidden">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <h1>CEO Yönetici Paneli</h1>
      </div>
      <div id="lastUpdatedPill" class="meta-pill">Güncelleniyor…</div>
    </header>

    <section class="grid">
      <!-- 1. ANA KART: NET GELİR KASASI -->
      <article class="card card-vault" aria-label="Net Gelir Kasası">
        <div class="card-label">Net Gelir Kasası</div>

        <div class="hero-total">
          <div>
            <div class="period-title">Toplam Net Kazanç</div>
            <div id="totalTry" class="hero-try">₺0.00</div>
          </div>
          <div id="totalUsd" class="hero-usd">$0.00</div>
        </div>

        <div class="period-row">
          <div class="period-box">
            <div class="period-title">Bu Ayki Kazanç</div>
            <div id="monthlyTry" class="period-try">₺0.00</div>
            <div id="monthlyUsd" class="period-usd">$0.00</div>
          </div>
          <div class="period-box">
            <div class="period-title">Bugünkü Kazanç</div>
            <div id="dailyTry" class="period-try">₺0.00</div>
            <div id="dailyUsd" class="period-usd">$0.00</div>
          </div>
        </div>

        <div id="sourcesList" class="sources-list"></div>
      </article>

      <!-- 2. ANA KART: GOOGLE PLAY'DE YAYINDAKİ OYUNLAR -->
      <article class="card" aria-label="Google Play'de Yayındaki Oyunlar">
        <div class="card-label">Google Play'de Yayındaki Oyunlar</div>
        <div id="gamesList" class="games-list"></div>
      </article>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      var SESSION_UNLOCK_KEY = "ceo_panel_unlocked_hash";

      function fmtTry(val) {
        var n = Number(val || 0);
        return "₺" + n.toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      function fmtUsd(val) {
        var n = Number(val || 0);
        return "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      function statusBadgeHtml(durumKodu, ozelMetin) {
        var isLive = durumKodu === "aktif";
        var cls = isLive ? "status-badge badge-live" : "status-badge badge-waiting";
        var label = ozelMetin || (isLive ? "Aktif" : "Aktif • Bekleniyor");
        return '<span class="' + cls + '">' + escapeHtml(label) + "</span>";
      }

      function escapeHtml(str) {
        return String(str == null ? "" : str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      /* Saf JS SHA-256 yedeği (file:// ve tüm tarayıcılar için) */
      function sha256PureJs(ascii) {
        function rightRotate(value, amount) {
          return (value >>> amount) | (value << (32 - amount));
        }
        var mathPow = Math.pow;
        var maxWord = mathPow(2, 32);
        var lengthProperty = "length";
        var i, j;
        var result = "";
        var words = [];
        var asciiBitLength = ascii[lengthProperty] * 8;
        var hash = [];
        var k = [];
        var primeCounter = 0;
        var isComposite = {};
        for (var candidate = 2; primeCounter < 64; candidate++) {
          if (!isComposite[candidate]) {
            for (i = 0; i < 313; i += candidate) {
              isComposite[i] = candidate;
            }
            hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
            k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
          }
        }
        ascii += "\x80";
        while ((ascii[lengthProperty] % 64) - 56) ascii += "\x00";
        for (i = 0; i < ascii[lengthProperty]; i++) {
          j = ascii.charCodeAt(i);
          words[i >> 2] |= j << (((3 - i) % 4) * 8);
        }
        words[words[lengthProperty]] = (asciiBitLength / maxWord) | 0;
        words[words[lengthProperty]] = asciiBitLength;
        for (j = 0; j < words[lengthProperty]; ) {
          var w = words.slice(j, (j += 16));
          var oldHash = hash.slice(0);
          for (i = 0; i < 64; i++) {
            var w15 = w[i - 15], w2 = w[i - 2];
            var a = hash[0], e = hash[4];
            var temp1 =
              hash[7] +
              (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) +
              ((e & hash[5]) ^ (~e & hash[6])) +
              k[i] +
              (w[i] =
                i < 16
                  ? w[i]
                  : (w[i - 16] +
                      (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3)) +
                      w[i - 7] +
                      (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))) |
                    0);
            var temp2 =
              (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) +
              ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
            hash = [(temp1 + temp2) | 0].concat(hash);
            hash[4] = (hash[4] + temp1) | 0;
            hash.pop();
          }
          for (i = 0; i < 8; i++) {
            hash[i] = (hash[i] + oldHash[i]) | 0;
          }
        }
        for (i = 0; i < 8; i++) {
          for (j = 3; j + 1; j--) {
            var b = (hash[i] >> (j * 8)) & 255;
            result += (b < 16 ? 0 : "") + b.toString(16);
          }
        }
        return result;
      }

      async function computePinDigest(pin) {
        var payload = "ceo_vault::" + String(pin || "").trim();
        if (window.crypto && window.crypto.subtle && window.TextEncoder) {
          try {
            var buf = await window.crypto.subtle.digest("SHA-256", new TextEncoder().encode(payload));
            return Array.from(new Uint8Array(buf))
              .map(function (b) { return b.toString(16).padStart(2, "0"); })
              .join("");
          } catch (_) {
            return sha256PureJs(unescape(encodeURIComponent(payload)));
          }
        }
        return sha256PureJs(unescape(encodeURIComponent(payload)));
      }

      function renderDashboard(data) {
        var kasa = data.net_gelir_kasasi || {};
        var doviz = data.doviz || {};
        var kaynaklar = data.kaynaklar || {};
        var oyunlar = Array.isArray(data.oyunlar) ? data.oyunlar : [];

        var kurMetni = doviz.usd_try ? " • $1 = ₺" + Number(doviz.usd_try).toFixed(2) : "";
        document.getElementById("lastUpdatedPill").textContent =
          (data.son_guncelleme_ts || "Canlı") + kurMetni;

        document.getElementById("totalTry").textContent = fmtTry(kasa.toplam_try);
        document.getElementById("totalUsd").textContent = fmtUsd(kasa.toplam_usd);
        document.getElementById("monthlyTry").textContent = fmtTry(kasa.aylik_try);
        document.getElementById("monthlyUsd").textContent = fmtUsd(kasa.aylik_usd);
        document.getElementById("dailyTry").textContent = fmtTry(kasa.gunluk_try);
        document.getElementById("dailyUsd").textContent = fmtUsd(kasa.gunluk_usd);

        var orderedSources = [
          kaynaklar.admob || { baslik: "AdMob", durum: "aktif_bekleniyor", toplam_try: 0, toplam_usd: 0 },
          kaynaklar.youtube || { baslik: "YouTube", durum: "aktif_bekleniyor", toplam_try: 0, toplam_usd: 0 },
          kaynaklar.itchio_magaza || { baslik: "itch.io / Mağaza", durum: "aktif_bekleniyor", toplam_try: 0, toplam_usd: 0 }
        ];

        var srcHtml = orderedSources
          .map(function (src) {
            return (
              '<div class="source-item">' +
              '<div class="source-left">' +
              '<span class="source-name">' + escapeHtml(src.baslik) + "</span>" +
              statusBadgeHtml(src.durum) +
              "</div>" +
              '<div class="source-right">' +
              '<div class="source-try">' + fmtTry(src.toplam_try) + "</div>" +
              '<div class="source-usd">' + fmtUsd(src.toplam_usd) + "</div>" +
              "</div>" +
              "</div>"
            );
          })
          .join("");
        document.getElementById("sourcesList").innerHTML = srcHtml;

        var gamesHtml = oyunlar
          .map(function (game) {
            var isPublished = game.durum_rozeti === "Yayında" || game.durum_kodu === "aktif";
            var badge = statusBadgeHtml(
              isPublished ? "aktif" : "aktif_bekleniyor",
              game.durum_rozeti || "Kapalı Testte"
            );
            return (
              '<div class="game-row">' +
              '<div class="game-info">' +
              '<div class="game-header">' +
              '<span class="game-title">' + escapeHtml(game.oyun_adi || "Light Path") + "</span>" +
              badge +
              '<span class="version-chip">' + escapeHtml(game.aktif_surum || "v63") + "</span>" +
              "</div>" +
              '<div class="game-perf">' + escapeHtml(game.performans_ozeti || "Kararlı Sürüm") + "</div>" +
              "</div>" +
              '<a class="play-btn" href="' + escapeHtml(game.magaza_linki || "https://play.google.com/store/apps/details?id=com.mttgames.lightpath") + '" target="_blank" rel="noopener noreferrer">' +
              "Google Play'de Aç ↗" +
              "</a>" +
              "</div>"
            );
          })
          .join("");
        document.getElementById("gamesList").innerHTML = gamesHtml;
      }

      function enforcePinIfConfigured(data) {
        var guv = data.guvenlik || {};
        var pinActive = Boolean(guv.pin_aktif && guv.pin_sha256);
        var overlay = document.getElementById("pinOverlay");
        var shell = document.getElementById("dashboardShell");

        if (!pinActive) {
          overlay.classList.remove("visible");
          shell.classList.remove("hidden");
          renderDashboard(data);
          return;
        }

        var savedHash = "";
        try {
          savedHash = sessionStorage.getItem(SESSION_UNLOCK_KEY) || "";
        } catch (_) {
          savedHash = "";
        }

        if (savedHash === guv.pin_sha256) {
          overlay.classList.remove("visible");
          shell.classList.remove("hidden");
          renderDashboard(data);
          return;
        }

        shell.classList.add("hidden");
        overlay.classList.add("visible");

        var form = document.getElementById("pinForm");
        var input = document.getElementById("pinInput");
        var errBox = document.getElementById("pinError");

        form.onsubmit = async function (ev) {
          ev.preventDefault();
          var digest = await computePinDigest(input.value);
          if (digest === guv.pin_sha256) {
            try {
              sessionStorage.setItem(SESSION_UNLOCK_KEY, digest);
            } catch (_) {}
            errBox.textContent = "";
            overlay.classList.remove("visible");
            shell.classList.remove("hidden");
            renderDashboard(data);
          } else {
            errBox.textContent = "Hatalı PIN kodu.";
            input.value = "";
            input.focus();
          }
        };
      }

      async function loadSummary() {
        try {
          var res = await fetch("./ceo_ozet.json?ts=" + Date.now(), { cache: "no-store" });
          if (!res.ok) return;
          var json = await res.json();
          enforcePinIfConfigured(json);
        } catch (_) {
          /* Yerel ağ gecikmesinde sessiz kal; teknik hata ekrana yansıtılmaz */
        }
      }

      loadSummary();
      setInterval(loadSummary, 60000);
    })();
  </script>
</body>
</html>
