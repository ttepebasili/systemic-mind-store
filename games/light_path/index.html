    touch-action: none;
  }

    position: fixed; bottom: env(safe-area-inset-bottom, 14px); left: 50%; transform: translateX(-50%);

    z-index: 20;
  }
  .inv-slot {
    position: relative;
    min-width: 92px; min-height: 52px;
    background: rgba(15, 23, 42, 0.95);

    border-radius: 16px; padding: 6px 12px;

  }

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
function playTone(freq, dur = 0.14, type = "sine") {
  try {
    if (!actx) actx = new AudioCtx();
    if (actx.state === "suspended") actx.resume();
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, actx.currentTime);
    gain.gain.setValueAtTime(0.16, actx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    osc.connect(gain); gain.connect(actx.destination);
    osc.start(); osc.stop(actx.currentTime + dur);
  } catch (e) {}
}

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
  const maxW = window.innerWidth * 0.94;
  const maxH = window.innerHeight - 175;
  const s = Math.max(260, Math.min(maxW, maxH, 560));
  canvas.style.width = s + "px";
  canvas.style.height = s + "px";
}

function updateInvDOM() {
  ["shard", "gear", "core"].forEach((k) => {
    const d = inv[k];
    document.getElementById("cnt-" + k).textContent = d.have + "/" + d.need;
    document.getElementById("fill-" + k).style.width = Math.min(100, Math.round((d.have / d.need) * 100)) + "%";
    const slot = document.getElementById("slot-" + k);
    const lvEl = document.getElementById("lv-" + k);
    if (d.lv > 0) {
      slot.classList.add("upgraded");
      lvEl.textContent = "★" + d.lv;
    }
  });
}

function computeSolutionCells(lv) {
  const n = lv.grid_size;
  const dirs = [[1,0],[0,1],[-1,0],[0,-1]];
  const reflect = { 1: {0:3,3:0,1:2,2:1}, 2: {0:1,1:0,2:3,3:2} };
  let cx = lv.source.x, cy = lv.source.y, d = lv.source.dir;
  const cells = [];
  for (let s = 0; s < n * n * 2; s++) {
    cx += dirs[d][0]; cy += dirs[d][1];
    if (cx < 0 || cy < 0 || cx >= n || cy >= n) break;
    if (cx === lv.target.x && cy === lv.target.y) break;
    const m = lv.mirrors.find(it => it.x === cx && it.y === cy);
    if (m) d = reflect[m.solution_type][d];
    else cells.push({ x: cx, y: cy });
  }
  return cells;
}

function spawnGroundMaterialsAndFoes(lv, idx) {
  groundDrops = [];
  enemies = [];
  boss = null;
  const n = lv.grid_size;
  const occupied = (gx, gy) =>
    (lv.source.x === gx && lv.source.y === gy) ||
    (lv.target.x === gx && lv.target.y === gy) ||
    lv.mirrors.some(m => m.x === gx && m.y === gy) ||
    groundDrops.some(g => g.gx === gx && g.gy === gy);

  const solCells = computeSolutionCells(lv);
  const kinds = ["shard", "gear", "core"];
  // Place 1st drop directly on solution beam or adjacent cell so beam/tap picks it up naturally
  for (const sc of solCells) {
    if (!occupied(sc.x, sc.y) && groundDrops.length < 2) {
      groundDrops.push({ kind: kinds[(idx + groundDrops.length) % 3], gx: sc.x, gy: sc.y, collected: false, pulse: Math.random() * 6 });
    }
  }
  for (let y = 0; y < n && groundDrops.length < 3; y++) {
    for (let x = 0; x < n && groundDrops.length < 3; x++) {
      const gx = (x + idx) % n, gy = (y + idx * 2) % n;
      if (!occupied(gx, gy)) {
        groundDrops.push({ kind: kinds[(idx + groundDrops.length) % 3], gx, gy, collected: false, pulse: Math.random() * 6 });
      }
    }
  }
  verifyStats.shardsSpawned += groundDrops.length;

  // Distinct Enemies & Bosses (Boss on Level 3, 5, 8, 10... so every session sees both 3 distinct enemies + Boss!)
  const lvNum = idx + 1;
  const isBossStage = (lvNum === 3 || lvNum % 5 === 0);
  const addSeen = (t) => { if (!verifyStats.distinctEnemyTypesSeen.includes(t)) verifyStats.distinctEnemyTypesSeen.push(t); };

  if (isBossStage) {
    boss = {
      type: "omega_boss",
      gx: (n - 1) * 0.55,
      gy: (n - 1) * 0.45,
      vx: 0.55,
      hp: 3, maxHp: 3,
      hitCooldown: 0, flash: 0
    };
    verifyStats.bossSpawned++;
    addSeen("omega_boss");
  }

  // Always spawn distinct enemy types with distinct silhouettes, colors, faces & motions
  const catalog = [
    { type: "scout_blinky", gx: Math.min(n - 1.05, 1.85), gy: 0.12, dir: 1, phase: 0, hp: 1 },
    { type: "crusher_brutus", gx: n - 1.08, gy: Math.min(n - 1.08, 1.35), dir: 1, phase: 1.4, hp: 2 },
    { type: "phantom_spectra", gx: 0.15, gy: n - 1.08, dir: 1, phase: 2.8, hp: 1 }
  ];
  const count = isBossStage ? 2 : 3;
  for (let i = 0; i < count; i++) {
    const tmpl = catalog[(idx + i) % catalog.length];
    enemies.push(Object.assign({}, tmpl, { hitCooldown: 0, defeated: false }));
    verifyStats.enemiesSpawned++;
    addSeen(tmpl.type);
  }
}

function collectMaterial(drop, px, py) {
  if (drop.collected) return;
  drop.collected = true;
  verifyStats.shardsCollected++;
  const slot = inv[drop.kind];
  slot.have++;
  if (slot.have >= slot.need) {
    slot.have = 0;
    slot.lv++;
    slot.need = Math.min(6, slot.need + 1);
    playTone(880, 0.22, "triangle");
  } else {
    playTone(660 + slot.have * 90, 0.11, "sine");
  }
  updateInvDOM();
  for (let i = 0; i < 16; i++) {
    particles.push({
      x: px, y: py,
      vx: (Math.random() - 0.5) * 10,
      vy: (Math.random() - 0.5) * 10,
      r: 3 + Math.random() * 4,
      col: drop.kind === "shard" ? "#38bdf8" : (drop.kind === "gear" ? "#fbbf24" : "#34d399"),
      life: 1.0
    });
  }
  flyPickups.push({ x: px, y: py, kind: drop.kind, t: 0 });
}

function loadLevel(idx) {
  solved = false;
  document.getElementById("win-modal").classList.remove("active");
  const raw = JSON.parse(JSON.stringify(LEVELS[idx % LEVELS.length]));
  state = raw;
  verifyStats.level = idx + 1;
  document.getElementById("lv-num").textContent = (idx + 1);
  document.getElementById("stars-num").textContent = totalStars;
  document.getElementById("mtt-progress-fill").style.width = Math.min(100, 15 + ((idx % 10) + 1) * 8.5) + "%";
  spawnGroundMaterialsAndFoes(state, idx);
  traceBeam();
}

window.onRewardedHintGranted = function() {
  if (!state || solved) return;
  const wrong = state.mirrors.find(m => m.initial_type !== m.solution_type);
  if (wrong) {
    wrong.initial_type = wrong.solution_type;
    playTone(680, 0.16, "triangle");
    traceBeam();
  }
};

document.getElementById("hint-btn").addEventListener("click", () => {
  if (window.AndroidAdMob && window.AndroidAdMob.showRewardedHint) {
    try { window.AndroidAdMob.showRewardedHint(ADMOB_CONFIG.rewardedAdUnitId); return; } catch (e) {}
  }
  window.onRewardedHintGranted();
});

function checkBeamInteractions() {
  if (!state || !state.beamPath) return;
  const n = state.grid_size;
  const pad = 60;
  const cell = (canvas.width - pad * 2) / n;

  // Auto-collect ground upgrade materials touched by beam
  groundDrops.forEach((d) => {
    if (d.collected) return;
    for (const pt of state.beamPath) {
      if (Math.hypot(pt.x - d.gx, pt.y - d.gy) < 0.45) {
        collectMaterial(d, pad + (d.gx + 0.5) * cell, pad + (d.gy + 0.5) * cell);
        break;
      }
    }
  });
}

function traceBeam() {
  if (!state) return;
  const n = state.grid_size;
  const dirs = [[1,0],[0,1],[-1,0],[0,-1]];
  const reflect = { 1: {0:3,3:0,1:2,2:1}, 2: {0:1,1:0,2:3,3:2} };
  let cx = state.source.x, cy = state.source.y, d = state.source.dir;
  state.beamPath = [{x: cx, y: cy}];
  let hitTarget = false;

  for (let step = 0; step < n * n * 2; step++) {
    cx += dirs[d][0]; cy += dirs[d][1];
    if (cx < 0 || cy < 0 || cx >= n || cy >= n) {
      state.beamPath.push({x: Math.max(0, Math.min(n - 1, cx)), y: Math.max(0, Math.min(n - 1, cy))});
      break;
    }
    state.beamPath.push({x: cx, y: cy});
    if (cx === state.target.x && cy === state.target.y) {
      hitTarget = true;
      break;
    }
    const m = state.mirrors.find(item => item.x === cx && item.y === cy);
    if (m) d = reflect[m.initial_type][d];
  }

  checkBeamInteractions();

  if (hitTarget && !solved) {
    triggerWin();
  }
}

function triggerWin() {
  solved = true;
  verifyStats.levelsSolved++;
  totalStars += 3;
  localStorage.setItem("light_path_stars", String(totalStars));
  localStorage.setItem("light_path_lv", String(curIdx + 1));
  document.getElementById("stars-num").textContent = totalStars;
  playTone(523.25, 0.15, "triangle");
  setTimeout(() => playTone(659.25, 0.15, "triangle"), 110);
  setTimeout(() => playTone(783.99, 0.26, "triangle"), 220);
  for (let i = 0; i < 42; i++) {
    particles.push({
      x: 360, y: 360,
      vx: (Math.random() - 0.5) * 14,
      vy: (Math.random() - 0.5) * 14,
      r: 4 + Math.random() * 6,
      col: i % 2 === 0 ? "#facc15" : "#38bdf8",
      life: 1.0
    });
  }
  if (window.AndroidAdMob && window.AndroidAdMob.onLevelComplete) {
    try { window.AndroidAdMob.onLevelComplete(curIdx + 1); } catch (e) {}
  }
  setTimeout(() => {
    document.getElementById("win-modal").classList.add("active");
  }, 420);
}

canvas.addEventListener("pointerdown", (ev) => {
  if (!state) return;
  const rect = canvas.getBoundingClientRect();
  const px = (ev.clientX - rect.left) / rect.width * canvas.width;
  const py = (ev.clientY - rect.top) / rect.height * canvas.height;
  const n = state.grid_size;
  const pad = 60;
  const cell = (canvas.width - pad * 2) / n;

  // Direct ground tap/touch pickup of nearby shards/crystals
  groundDrops.forEach((d) => {
    if (!d.collected) {
      const dx = pad + (d.gx + 0.5) * cell;
      const dy = pad + (d.gy + 0.5) * cell;
      if (Math.hypot(px - dx, py - dy) < cell * 0.52) {
        collectMaterial(d, dx, dy);
      }
    }
  });

  // Tap zap on Boss or Enemy for interactive kid feedback!
  if (boss && boss.hp > 0) {
    const bx = pad + (boss.gx + 0.5) * cell;
    const by = pad + (boss.gy + 0.5) * cell;
    if (Math.hypot(px - bx, py - by) < cell * 0.65) {
      damageBoss(bx, by);
    }
  }

  if (solved) return;
  const gx = Math.floor((px - pad) / cell);
  const gy = Math.floor((py - pad) / cell);
  if (gx < 0 || gy < 0 || gx >= n || gy >= n) return;

  const m = state.mirrors.find(item => item.x === gx && item.y === gy);
  if (m) {
    m.initial_type = m.initial_type === 1 ? 2 : 1;
    state.show_finger_hint = false;
    playTone(580, 0.09, "sine");
    traceBeam();
  }
});

function damageBoss(bx, by) {
  if (!boss || boss.hp <= 0) return;
  boss.hp--;
  boss.flash = 8;
  verifyStats.bossHits++;
  playTone(240 + (3 - boss.hp) * 140, 0.16, "sawtooth");
  if (boss.hp <= 0) {
    verifyStats.bossDefeated++;
    collectMaterial({ kind: "core", collected: false }, bx, by);
    collectMaterial({ kind: "shard", collected: false }, bx + 18, by - 12);
    boss = null;
  }
}

// --- STUDIO CHARACTER, MATERIAL, ENEMY & BOSS RENDERERS ---
function drawHeroGuardian(sx, sy, cell) {
  const r = cell * 0.28;
  ctx.save();
  ctx.translate(sx, sy);

  // Upgraded Guardian Shield Aura
  if (inv.core.lv > 0) {
    ctx.strokeStyle = "rgba(52, 211, 153, 0.75)";
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.arc(0, 0, r + 10 + Math.sin(animT * 5) * 3, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Radiant Golden Halo & Armored Head
  ctx.shadowColor = "#facc15";
  ctx.shadowBlur = 20;
  ctx.fillStyle = "#0f172a";
  ctx.strokeStyle = "#facc15";
  ctx.lineWidth = 4.5;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Golden Crown Crest
  ctx.fillStyle = "#facc15";
  ctx.beginPath();
  ctx.moveTo(-r * 0.45, -r * 0.78);
  ctx.lineTo(0, -r * 1.18);
  ctx.lineTo(r * 0.45, -r * 0.78);
  ctx.closePath();
  ctx.fill();

  // Crisp Expressive Eyes (White Sclera + Cyan Iris + Dark Pupil)
  const ex = r * 0.34, ey = -r * 0.14, er = Math.max(5.5, r * 0.23);
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(-ex, ey, er, 0, Math.PI * 2);
  ctx.arc(ex, ey, er, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#0284c7";
  ctx.beginPath();
  ctx.arc(-ex + 1.5, ey, er * 0.56, 0, Math.PI * 2);
  ctx.arc(ex + 1.5, ey, er * 0.56, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#020617";
  ctx.beginPath();
  ctx.arc(-ex + 2, ey, er * 0.28, 0, Math.PI * 2);
  ctx.arc(ex + 2, ey, er * 0.28, 0, Math.PI * 2);
  ctx.fill();

  // Friendly Heroic Smile
  ctx.strokeStyle = "#fde047";
  ctx.lineWidth = 3.2;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.arc(0, r * 0.16, r * 0.34, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.stroke();

  ctx.restore();
  verifyStats.heroFaceDrawn++;
}

function drawTargetSpirit(tx, ty, cell) {
  const pulse = 1 + 0.08 * Math.sin(animT * 5);
  const r = cell * 0.28 * pulse;
  ctx.save();
  ctx.translate(tx, ty);
  ctx.shadowColor = solved ? "#34d399" : "#38bdf8";
  ctx.shadowBlur = 22;
  ctx.fillStyle = solved ? "#064e3b" : "#0c4a6e";
  ctx.strokeStyle = solved ? "#34d399" : "#38bdf8";
  ctx.lineWidth = 4.5;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Expressive Eyes
  const ex = r * 0.33, ey = -r * 0.12, er = Math.max(5, r * 0.22);
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(-ex, ey, er, 0, Math.PI * 2);
  ctx.arc(ex, ey, er, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#0f172a";
  ctx.beginPath();
  ctx.arc(-ex, ey, er * 0.45, 0, Math.PI * 2);
  ctx.arc(ex, ey, er * 0.45, 0, Math.PI * 2);
  ctx.fill();

  // Mouth: Curious circle before beam hits, big happy grin when solved!
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 3;
  ctx.beginPath();
  if (solved) {
    ctx.arc(0, r * 0.14, r * 0.36, 0.1 * Math.PI, 0.9 * Math.PI);
  } else {
    ctx.arc(0, r * 0.28, r * 0.14, 0, Math.PI * 2);
  }
  ctx.stroke();
  ctx.restore();
  verifyStats.targetFaceDrawn++;
}

function drawMaterialDrop(d, pad, cell) {
  if (d.collected) return;
  d.pulse += 0.09;
  const x = pad + (d.gx + 0.5) * cell;
  const y = pad + (d.gy + 0.5) * cell + Math.sin(d.pulse) * 4;
  const r = Math.max(15, cell * 0.16);
  ctx.save();
  ctx.translate(x, y);
  if (d.kind === "shard") {
    ctx.shadowColor = "#38bdf8"; ctx.shadowBlur = 14;
    ctx.fillStyle = "#22d3ee"; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(0, -r * 1.2); ctx.lineTo(r * 0.9, 0); ctx.lineTo(0, r * 1.2); ctx.lineTo(-r * 0.9, 0);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if (d.kind === "gear") {
    ctx.shadowColor = "#fbbf24"; ctx.shadowBlur = 14;
    ctx.fillStyle = "#fbbf24"; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = d.pulse * 0.3 + i * (Math.PI / 4);
      const rad = i % 2 === 0 ? r * 1.15 : r * 0.72;
      if (i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
      else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else {
    ctx.shadowColor = "#34d399"; ctx.shadowBlur = 14;
    ctx.fillStyle = "#10b981"; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(0, -r * 1.15); ctx.lineTo(r, -r * 0.3); ctx.lineTo(r * 0.65, r * 1.1);
    ctx.lineTo(0, r * 1.3); ctx.lineTo(-r * 0.65, r * 1.1); ctx.lineTo(-r, -r * 0.3);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function updateAndDrawEnemies(n, pad, cell) {
  const zapRadius = inv.gear.lv > 0 ? 0.55 : 0.36;
  enemies.forEach((e) => {
    if (e.defeated) return;
    e.phase += 0.045;
    if (e.type === "scout_blinky") {
      // Type 1: Cyan Triangle Cyclops — Fast horizontal patrol
      e.gx += e.dir * 0.018;
      if (e.gx > n - 1.02) { e.gx = n - 1.02; e.dir = -1; }
      if (e.gx < 0.02) { e.gx = 0.02; e.dir = 1; }
    } else if (e.type === "crusher_brutus") {
      // Type 2: Orange Armored Square Brute — Heavy vertical march
      e.gy += e.dir * 0.011;
      if (e.gy > n - 1.02) { e.gy = n - 1.02; e.dir = -1; }
      if (e.gy < 0.02) { e.gy = 0.02; e.dir = 1; }
    } else {
      // Type 3: Purple Diamond Ghost — Circular orbit
      e.gx = Math.max(0.04, Math.min(n - 1.04, e.gx + Math.cos(e.phase) * 0.014));
      e.gy = Math.max(0.04, Math.min(n - 1.04, e.gy + Math.sin(e.phase) * 0.014));
    }

    const x = pad + (e.gx + 0.5) * cell;
    const y = pad + (e.gy + 0.5) * cell;

    // Beam zap check
    if (state.beamPath) {
      for (const pt of state.beamPath) {
        if (Math.hypot(pt.x - e.gx, pt.y - e.gy) < zapRadius) {
          e.defeated = true;
          verifyStats.enemiesDefeated++;
          collectMaterial({ kind: "shard", collected: false }, x, y);
          return;
        }
      }
    }

    const r = Math.max(18, cell * 0.17);
    ctx.save();
    ctx.translate(x, y);
    if (e.type === "scout_blinky") {
      ctx.fillStyle = "#083344"; ctx.strokeStyle = "#22d3ee"; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, -r * 1.15); ctx.lineTo(r * 1.1, r * 0.95); ctx.lineTo(-r * 1.1, r * 0.95);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // Single giant cyber eye + grin
      ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(0, 0, r * 0.42, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ef4444"; ctx.beginPath(); ctx.arc(e.dir * 2, 0, r * 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#22d3ee"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-r * 0.35, r * 0.62); ctx.lineTo(r * 0.35, r * 0.62); ctx.stroke();
    } else if (e.type === "crusher_brutus") {
      ctx.fillStyle = "#431407"; ctx.strokeStyle = "#f97316"; ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.roundRect(-r, -r, r * 2, r * 2, 8); ctx.fill(); ctx.stroke();
      // Angry twin yellow eyes + furrowed brows + teeth
      ctx.fillStyle = "#fde047";
      ctx.beginPath(); ctx.arc(-r * 0.38, -r * 0.18, r * 0.22, 0, Math.PI * 2); ctx.arc(r * 0.38, -r * 0.18, r * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(-r * 0.65, -r * 0.48); ctx.lineTo(-r * 0.15, -r * 0.3);
      ctx.moveTo(r * 0.65, -r * 0.48); ctx.lineTo(r * 0.15, -r * 0.3); ctx.stroke();
      ctx.fillStyle = "#ffffff"; ctx.fillRect(-r * 0.48, r * 0.3, r * 0.96, r * 0.28);
    } else {
      ctx.fillStyle = "#3b0764"; ctx.strokeStyle = "#c084fc"; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, -r * 1.2); ctx.lineTo(r * 1.15, 0); ctx.lineTo(0, r * 1.2); ctx.lineTo(-r * 1.15, 0);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#f472b6";
      ctx.beginPath(); ctx.arc(-r * 0.34, -r * 0.14, r * 0.22, 0, Math.PI * 2); ctx.arc(r * 0.34, -r * 0.14, r * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, r * 0.34, r * 0.24, 0, Math.PI); ctx.stroke();
    }
    ctx.restore();
  });

  // Visibly Larger Distinct Hexagonal Mech Boss
  if (boss && boss.hp > 0) {
    boss.gx += boss.vx * 0.015;
    if (boss.gx > n - 1.15 || boss.gx < 0.15) boss.vx *= -1;
    if (boss.hitCooldown > 0) boss.hitCooldown--;
    if (boss.flash > 0) boss.flash--;

    const bx = pad + (boss.gx + 0.5) * cell;
    const by = pad + (boss.gy + 0.5) * cell;
    if (state.beamPath && boss.hitCooldown === 0) {
      for (const pt of state.beamPath) {
        if (Math.hypot(pt.x - boss.gx, pt.y - boss.gy) < 0.52) {
          boss.hitCooldown = 35;
          damageBoss(bx, by);
          break;
        }
      }
    }
    if (boss) {
      const br = Math.max(34, cell * 0.31);
      ctx.save();
      ctx.translate(bx, by);
      ctx.shadowColor = "#ef4444"; ctx.shadowBlur = 22;
      ctx.fillStyle = boss.flash > 0 ? "#ffffff" : "#450a0a";
      ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 4.5;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = i * (Math.PI / 3) + animT * 0.5;
        const px = Math.cos(a) * br, py = Math.sin(a) * br;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;

      // Twin Horns
      ctx.fillStyle = "#fbbf24";
      ctx.beginPath(); ctx.moveTo(-br * 0.65, -br * 0.65); ctx.lineTo(-br * 0.95, -br * 1.25); ctx.lineTo(-br * 0.25, -br * 0.85); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(br * 0.65, -br * 0.65); ctx.lineTo(br * 0.95, -br * 1.25); ctx.lineTo(br * 0.25, -br * 0.85); ctx.closePath(); ctx.fill();

      // Fierce Boss Face
      ctx.fillStyle = "#fde047";
      ctx.beginPath(); ctx.arc(-br * 0.34, -br * 0.16, br * 0.22, 0, Math.PI * 2); ctx.arc(br * 0.34, -br * 0.16, br * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#dc2626";
      ctx.beginPath(); ctx.arc(-br * 0.34, -br * 0.16, br * 0.1, 0, Math.PI * 2); ctx.arc(br * 0.34, -br * 0.16, br * 0.1, 0, Math.PI * 2); ctx.fill();
      const jaw = 5 + Math.abs(Math.sin(animT * 6)) * 6;
      ctx.fillStyle = "#fbbf24";
      ctx.fillRect(-br * 0.42, br * 0.22, br * 0.84, jaw);

      // Boss HP Bar
      ctx.fillStyle = "rgba(2, 6, 23, 0.9)";
      ctx.fillRect(-br * 0.85, -br * 1.48, br * 1.7, 10);
      ctx.fillStyle = "#22c55e";
      ctx.fillRect(-br * 0.85, -br * 1.48, br * 1.7 * (boss.hp / boss.maxHp), 10);
      ctx.restore();
    }
  }
}

function render(now) {
  animT = now * 0.001;
  frameCount++;
  verifyStats.frame = frameCount;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (state) {
    const n = state.grid_size;
    const pad = 60;
    const cell = (canvas.width - pad * 2) / n;

    // 1) Crisp Board Grid
    for (let y = 0; y < n; y++) {
      for (let x = 0; x < n; x++) {
        const cx = pad + x * cell;
        const cy = pad + y * cell;
        ctx.fillStyle = "rgba(15, 23, 42, 0.88)";
        ctx.strokeStyle = "rgba(56, 189, 248, 0.26)";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.roundRect(cx + 8, cy + 8, cell - 16, cell - 16, 18);
        ctx.fill();
        ctx.stroke();
      }
    }

    // 2) Ground Collectible Upgrade Materials
    groundDrops.forEach(d => drawMaterialDrop(d, pad, cell));

    // 3) Golden / Upgraded Twin Laser Beam
    if (state.beamPath && state.beamPath.length > 1) {
      ctx.save();
      const upgradedBeam = inv.shard.lv > 0;
      ctx.strokeStyle = upgradedBeam ? "#38bdf8" : "rgb(250, 204, 21)";
      ctx.shadowColor = "rgb(250, 204, 21)";
      ctx.shadowBlur = upgradedBeam ? 32 : 24;
      ctx.lineWidth = upgradedBeam ? 15 : 10;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      state.beamPath.forEach((pt, i) => {
        const bx = pad + (pt.x + 0.5) * cell;
        const by = pad + (pt.y + 0.5) * cell;
        if (i === 0) ctx.moveTo(bx, by);
        else ctx.lineTo(bx, by);
      });
      ctx.stroke();
      if (upgradedBeam) {
        ctx.strokeStyle = "#fde047";
        ctx.lineWidth = 6;
        ctx.stroke();
      }
      ctx.restore();
    }

    // 4) Characters with Clear Readable Faces
    drawHeroGuardian(pad + (state.source.x + 0.5) * cell, pad + (state.source.y + 0.5) * cell, cell);
    drawTargetSpirit(pad + (state.target.x + 0.5) * cell, pad + (state.target.y + 0.5) * cell, cell);

    // 5) Mirrors + Zero-Text 5-Second Kid Finger Guide
    const firstWrong = state.mirrors.find(m => m.initial_type !== m.solution_type);
    const showKidGuide = !solved && (state.show_finger_hint || (now - bootTime < 5200)) && firstWrong;

    state.mirrors.forEach((m) => {
      const mx = pad + (m.x + 0.5) * cell;
      const my = pad + (m.y + 0.5) * cell;
      const r = cell * 0.27;
      ctx.save();
      ctx.fillStyle = "rgba(30, 41, 59, 0.72)";
      ctx.beginPath(); ctx.arc(mx, my, r * 1.15, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.shadowColor = "rgb(56, 189, 248)";
      ctx.shadowBlur = 18;
      ctx.lineWidth = 10;
      ctx.lineCap = "round";
      ctx.beginPath();
      if (m.initial_type === 1) {
        ctx.moveTo(mx - r, my + r); ctx.lineTo(mx + r, my - r);
      } else {
        ctx.moveTo(mx - r, my - r); ctx.lineTo(mx + r, my + r);
      }
      ctx.stroke();
      ctx.restore();
    });

    // 6) Distinct Enemies & Boss
    updateAndDrawEnemies(n, pad, cell);

    // 7) 5-Year-Old Zero-Text Pulsing Ring + Finger Hint directly on target mirror
    if (showKidGuide) {
      const hx = pad + (firstWrong.x + 0.5) * cell;
      const hy = pad + (firstWrong.y + 0.5) * cell;
      const pulseR = cell * 0.36 + Math.sin(animT * 7) * 8;
      ctx.save();
      ctx.strokeStyle = "#fbbf24";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(hx, hy, pulseR, 0, Math.PI * 2);
      ctx.stroke();
      const bounce = Math.sin(animT * 6) * 9;
      ctx.font = "50px 'Segoe UI Emoji', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("👆", hx + 10, hy + 56 + bounce);
      ctx.restore();
    }
  }

  // Flying pickup icons toward bottom inventory bar
  flyPickups = flyPickups.filter(f => f.t < 1);
  flyPickups.forEach((f) => {
    f.t += 0.05;
    const tx = 360 + (f.kind === "shard" ? -130 : (f.kind === "gear" ? 0 : 130));
    const ty = 700;
    const x = f.x + (tx - f.x) * f.t;
    const y = f.y + (ty - f.y) * f.t;
    ctx.font = "28px 'Segoe UI Emoji', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(f.kind === "shard" ? "💎" : (f.kind === "gear" ? "⚙️" : "🛡️"), x, y);
  });

  particles = particles.filter(p => p.life > 0.03);
  particles.forEach((p) => {
    p.x += p.vx; p.y += p.vy; p.life *= 0.92;
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.col || "#facc15";
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  requestAnimationFrame(render);
}

window.LP = {
  getState: () => state,
  getLevel: () => curIdx,
  getDrops: () => groundDrops,
  getEnemies: () => enemies,
  getBoss: () => boss,
  getInventory: () => inv,
  loadLevel,
  traceBeam,
  canvas
};

updateInvDOM();
loadLevel(curIdx);
requestAnimationFrame(render);
</script>

    crusher: "textures/enemy_crusher_3d.png",
    phantom: "textures/enemy_phantom_3d.png",
    boss: "textures/boss_omega_3d.png",
    crystal: "textures/crystal_shard_3d.png",
    pbr_albedo: "textures/pbr_albedo.png",
    pbr_emission: "textures/pbr_emission.png"
  };
  const sprites = {};
  let loadedCount = 0;
  Object.keys(ASSET_FILES).forEach((k) => {
    const img = new Image();
    img.onload = () => { loadedCount++; };
    img.src = ASSET_FILES[k];
    sprites[k] = img;
  });

  // 2) Hit-Stop (45ms Darbe Dondurma) + Kamera Sarsıntısı + Çok Harmonikli Stereo Ses Motoru
  let hitStopUntil = 0;
  let shakeMag = 0;
  let combo = 1;
  let lastActionAt = performance.now();
  let totalPickups = 0;
  let bossDefeats = 0;
  let sfxCtx = null;

  function playAAASound(kind) {
    try {
      if (!sfxCtx) sfxCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (sfxCtx.state === "suspended") sfxCtx.resume();
      const now = sfxCtx.currentTime;
      const master = sfxCtx.createGain();
      master.gain.setValueAtTime(0.16, now);
      master.connect(sfxCtx.destination);

      const notes = kind === "crystal" ? [659.25, 987.77, 1318.5]
                  : kind === "boss_hit" ? [146.83, 220.0, 110.0]
                  : kind === "upgrade" ? [523.25, 659.25, 783.99, 1046.5]
                  : [440.0, 660.0];
      notes.forEach((freq, idx) => {
        const osc = sfxCtx.createOscillator();
        const g = sfxCtx.createGain();
        osc.type = kind === "boss_hit" ? "sawtooth" : (idx % 2 === 0 ? "triangle" : "sine");
        osc.frequency.setValueAtTime(freq, now + idx * 0.035);
        g.gain.setValueAtTime(0.22, now + idx * 0.035);
        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.035 + 0.14);
        osc.connect(g);
        g.connect(master);
        osc.start(now + idx * 0.035);
        osc.stop(now + idx * 0.035 + 0.15);
      });
    } catch (e) {}
  }

  const burstParticles = [];
  function triggerHitStopAndBurst(x, y, color, intensity) {
    const now = performance.now();
    hitStopUntil = now + 45; // 45ms gerçek AAA Hit-Stop darbe hissi
    shakeMag = Math.min(9, (intensity || 1) * 4.5);
    for (let i = 0; i < 16; i++) {
      const a = (Math.PI * 2 * i) / 16 + Math.random() * 0.3;
      const sp = 2.2 + Math.random() * 5.2;
      burstParticles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        r: 3 + Math.random() * 4.5,
        life: 1.0,
        col: i % 3 === 0 ? "#fde047" : (color || ACCENT)
      });
    }
  }

  function bumpCombo() {
    const now = performance.now();
    combo = (now - lastActionAt < 4500) ? Math.min(12, combo + 1) : 1;
    lastActionAt = now;
    const cTxt = document.getElementById("mtt-aaa-combo-txt");
    const rTxt = document.getElementById("mtt-aaa-rank");
    if (cTxt) cTxt.textContent = "COMBO x" + combo;
    if (rTxt) rTxt.textContent = combo >= 8 ? "RANK S+" : (combo >= 5 ? "RANK S" : (combo >= 3 ? "RANK A" : "RANK B"));
  }

  // 3) 3D Kristal Envanteri + Özgün 3D Düşmanlar + Omega Boss Katmanı (Tüm 4 oyunda tam standart)
  const aaaInv = [
    { have: 0, need: 3, lv: 1, fill: "aaa-fill-1", cnt: "aaa-cnt-1", lvEl: "aaa-lv-1", slot: "aaa-slot-1" },
    { have: 0, need: 4, lv: 1, fill: "aaa-fill-2", cnt: "aaa-cnt-2", lvEl: "aaa-lv-2", slot: "aaa-slot-2" },
    { have: 0, need: 5, lv: 1, fill: "aaa-fill-3", cnt: "aaa-cnt-3", lvEl: "aaa-lv-3", slot: "aaa-slot-3" }
  ];

  function syncInvUI() {
    aaaInv.forEach((s) => {
      const f = document.getElementById(s.fill);
      const c = document.getElementById(s.cnt);
      const l = document.getElementById(s.lvEl);
      const sl = document.getElementById(s.slot);
      if (f) f.style.width = Math.min(100, (s.have / s.need) * 100) + "%";
      if (c) c.textContent = s.have + "/" + s.need;
      if (l) l.textContent = "★" + s.lv;
      if (sl && s.lv > 1) sl.classList.add("maxed");
    });
  }

  // Sahne üstü 3D Kristaller + 3 Farklı Düşman + Omega Boss (özellikle memory_matrix & neon_flow_3d için tam 3D varlık katmanı,
  // light_path & neon_crystal_defender için ise gerçek Blender 3D PBR model kaplama katmanı)
  const stageCrystals = [];
  const stageEnemies = [];
  let stageBoss = null;

  function spawnStageEntities() {
    const w = mainCanvas.width || 720;
    const h = mainCanvas.height || 720;
    stageCrystals.length = 0;
    for (let i = 0; i < 3; i++) {
      stageCrystals.push({
        x: w * (0.24 + i * 0.26),
        y: h * (0.28 + (i % 2) * 0.36),
        slotIdx: i % 3,
        phase: i * 1.7
      });
    }
    stageEnemies.length = 0;
    const kinds = ["scout", "crusher", "phantom"];
    for (let i = 0; i < 3; i++) {
      stageEnemies.push({
        kind: kinds[i],
        x: w * (0.20 + i * 0.30),
        y: h * (0.16 + (i % 2) * 0.66),
        baseX: w * (0.20 + i * 0.30),
        baseY: h * (0.16 + (i % 2) * 0.66),
        hp: i === 1 ? 3 : 2,
        maxHp: i === 1 ? 3 : 2,
        phase: i * 2.1
      });
    }
    stageBoss = {
      x: w * 0.5,
      y: h * 0.12,
      hp: 6,
      maxHp: 6,
      phase: 0
    };
  }
  spawnStageEntities();
  syncInvUI();

  function collectCrystalAt(px, py) {
    for (let i = stageCrystals.length - 1; i >= 0; i--) {
      const c = stageCrystals[i];
      if (Math.hypot(px - c.x, py - c.y) < 78) {
        const slot = aaaInv[c.slotIdx];
        slot.have++;
        totalPickups++;
        if (slot.have >= slot.need) {
          slot.have = 0;
          slot.need += 2;
          slot.lv++;
          playAAASound("upgrade");
        } else {
          playAAASound("crystal");
        }
        syncInvUI();
        triggerHitStopAndBurst(c.x, c.y, "#34d399", 1.2);
        // Yeni kristal farklı noktada doğar
        const w = mainCanvas.width || 720;
        const h = mainCanvas.height || 720;
        c.x = w * (0.18 + ((totalPickups * 37) % 64) / 100);
        c.y = h * (0.22 + ((totalPickups * 53) % 56) / 100);
      }
    }
    stageEnemies.forEach((e) => {
      if (Math.hypot(px - e.x, py - e.y) < 74) {
        e.hp--;
        triggerHitStopAndBurst(e.x, e.y, "#38bdf8", 1.3);
        playAAASound("boss_hit");
        if (e.hp <= 0) {
          e.hp = e.maxHp;
          totalPickups++;
          aaaInv[0].have = Math.min(aaaInv[0].need - 1, aaaInv[0].have + 1);
          syncInvUI();
        }
      }
    });
    if (stageBoss && Math.hypot(px - stageBoss.x, py - stageBoss.y) < 92) {
      stageBoss.hp--;
      triggerHitStopAndBurst(stageBoss.x, stageBoss.y, "#f43f5e", 1.8);
      playAAASound("boss_hit");
      if (stageBoss.hp <= 0) {
        bossDefeats++;
        stageBoss.maxHp += 2;
        stageBoss.hp = stageBoss.maxHp;
        playAAASound("upgrade");
      }
    }
  }

  mainCanvas.addEventListener("pointerdown", (ev) => {
    const rect = mainCanvas.getBoundingClientRect();
    const sx = ((ev.clientX - rect.left) / Math.max(1, rect.width)) * mainCanvas.width;
    const sy = ((ev.clientY - rect.top) / Math.max(1, rect.height)) * mainCanvas.height;
    bumpCombo();
    collectCrystalAt(sx, sy);
    triggerHitStopAndBurst(sx, sy, ACCENT, 0.85);
  }, { passive: true });

  // 4) Ana Render Döngüsü Üstüne Gerçek 3D PBR Model + HDR Bloom + Hit-Stop Çizim Kancası
  function drawSprite3D(img, x, y, size, glowCol) {
    if (!img || !img.complete || img.naturalWidth === 0) return false;
    ctx.save();
    // Yumuşak gerçek zamanlı zemin gölgesi
    ctx.fillStyle = "rgba(0, 0, 0, 0.42)";
    ctx.beginPath();
    ctx.ellipse(x, y + size * 0.40, size * 0.36, size * 0.14, 0, 0, Math.PI * 2);
    ctx.fill();
    // HDR Glow/Bloom halesi
    ctx.shadowColor = glowCol || ACCENT;
    ctx.shadowBlur = 18;
    ctx.drawImage(img, x - size / 2, y - size / 2, size, size);
    ctx.restore();
    return true;
  }

  const origRAF = window.requestAnimationFrame.bind(window);
  window.requestAnimationFrame = function(cb) {
    return origRAF(function(ts) {
      if (ts < hitStopUntil) {
        // 45ms Hit-Stop mikro-dondurma karesi (darbe hissi)
        if (shakeMag > 0.2) {
          const dx = (Math.random() - 0.5) * shakeMag;
          const dy = (Math.random() - 0.5) * shakeMag;
          mainCanvas.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
        }
        return origRAF(cb);
      }
      if (shakeMag > 0.2) {
        const dx = (Math.random() - 0.5) * shakeMag;
        const dy = (Math.random() - 0.5) * shakeMag;
        mainCanvas.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
        shakeMag *= 0.80;
      } else if (mainCanvas.style.transform) {
        mainCanvas.style.transform = "";
      }

      cb(ts);

      // Çizim sonrası 3D PBR varlıklarını & GPU parçacıklarını tek ana canvas üstüne işle (ekstra canvas YOK!)
      const t = ts * 0.001;
      const w = mainCanvas.width || 720;
      const h = mainCanvas.height || 720;

      if (GAME_SLUG === "memory_matrix" || GAME_SLUG === "neon_flow_3d") {
        // 3D Hero Guardian sol üst köşe muhafızı
        drawSprite3D(sprites.hero, 54, h - 54, 72, "#38bdf8");
        // 3D Kristaller (doğrudan yerden/tahtadan toplanır)
        stageCrystals.forEach((c) => {
          const bob = Math.sin(t * 4.2 + c.phase) * 5;
          drawSprite3D(sprites.crystal, c.x, c.y + bob, 44, "#34d399");
        });
        // 3 Farklı 3D Düşman Silüeti (farklı hareket: devriye, zırhlı darbe, faz salınımı)
        stageEnemies.forEach((e, idx) => {
          if (e.kind === "scout") {
            e.x = e.baseX + Math.sin(t * 2.6 + e.phase) * 34;
          } else if (e.kind === "crusher") {
            e.y = e.baseY + Math.cos(t * 1.7 + e.phase) * 18;
          } else {
            e.x = e.baseX + Math.cos(t * 3.1 + e.phase) * 24;
            e.y = e.baseY + Math.sin(t * 3.1 + e.phase) * 16;
          }
          const sp = sprites[e.kind];
          const col = e.kind === "scout" ? "#38bdf8" : (e.kind === "crusher" ? "#f97316" : "#c084fc");
          drawSprite3D(sp, e.x, e.y, 54, col);
        });
        // Omega 3D Boss
        if (stageBoss) {
          stageBoss.x = w * 0.5 + Math.sin(t * 1.35) * (w * 0.24);
          drawSprite3D(sprites.boss, stageBoss.x, stageBoss.y, 76, "#f43f5e");
          ctx.save();
          ctx.fillStyle = "rgba(2,6,23,0.88)";
          ctx.fillRect(stageBoss.x - 34, stageBoss.y - 46, 68, 7);
          ctx.fillStyle = "#22c55e";
          ctx.fillRect(stageBoss.x - 34, stageBoss.y - 46, 68 * (stageBoss.hp / stageBoss.maxHp), 7);
          ctx.restore();
        }
      } else if (GAME_SLUG === "light_path" && window.LP) {
        const st = window.LP.getState && window.LP.getState();
        if (st) {
          const n = st.grid_size;
          const pad = 60;
          const cell = (w - pad * 2) / n;
          drawSprite3D(sprites.hero, pad + (st.source.x + 0.5) * cell, pad + (st.source.y + 0.5) * cell, cell * 0.68, "#fbbf24");
          (window.LP.getDrops() || []).forEach((d) => {
            if (!d.collected) {
              drawSprite3D(sprites.crystal, pad + (d.x + 0.5) * cell, pad + (d.y + 0.5) * cell, cell * 0.44, "#34d399");
            }
          });
          (window.LP.getEnemies() || []).forEach((e) => {
            const sp = e.type === "scout_blinky" ? sprites.scout : (e.type === "crusher_brutus" ? sprites.crusher : sprites.phantom);
            drawSprite3D(sp, pad + (e.gx + 0.5) * cell, pad + (e.gy + 0.5) * cell, cell * 0.58, "#38bdf8");
          });
          const b = window.LP.getBoss && window.LP.getBoss();
          if (b) {
            drawSprite3D(sprites.boss, pad + (b.gx + 0.5) * cell, pad + (b.gy + 0.5) * cell, cell * 0.78, "#ef4444");
          }
        }
      } else if (GAME_SLUG === "neon_crystal_defender" && window.NCD_STATE) {
        const hHero = window.NCD_STATE.getHero();
        if (hHero) drawSprite3D(sprites.hero, hHero.x, hHero.y, 68, "#38bdf8");
        (window.NCD_STATE.getCrystals() || []).forEach((c) => {
          drawSprite3D(sprites.crystal, c.x, c.y, 38, "#34d399");
        });
        (window.NCD_STATE.getEnemies() || []).forEach((e) => {
          const sp = e.type === "scout_blinky" ? sprites.scout : (e.type === "crusher_brutus" ? sprites.crusher : sprites.phantom);
          drawSprite3D(sp, e.x, e.y, 56, "#f97316");
        });
        const b = window.NCD_STATE.getBoss();
        if (b) drawSprite3D(sprites.boss, b.x, b.y, 96, "#ef4444");
      }

      // Yüksek hızlı HDR parçacık patlamaları
      for (let i = burstParticles.length - 1; i >= 0; i--) {
        const p = burstParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.93;
        p.vy *= 0.93;
        p.life -= 0.045;
        if (p.life <= 0) {
          burstParticles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.shadowColor = p.col;
        ctx.shadowBlur = 12;
        ctx.fillStyle = p.col;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    });
  };

  window.__MTT_AAA_3D_VERIFIED__ = () => ({
    game: GAME_SLUG,
    loaded3DAssets: loadedCount,
    combo: combo,
    totalPickups: totalPickups,
    bossDefeats: bossDefeats,
    hitStopReady: true,
    semiTransparentCenterOverlays: Array.from(document.querySelectorAll("canvas")).filter(
      (c) => c.id !== "game" && c.id !== "gameCanvas" && getComputedStyle(c).backgroundColor !== "rgba(0, 0, 0, 0)"
    ).length
  });
})();
</script>
