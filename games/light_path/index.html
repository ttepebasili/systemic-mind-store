const CATEGORY = "light_path_update";
let curIdx = parseInt(localStorage.getItem("light_path_lv") || "0", 10) % LEVELS.length;
let totalStars = parseInt(localStorage.getItem("light_path_stars") || "0", 10);
let state = null;
let particles = [];
let solved = false;
let animT = 0;

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
function playTone(freq, dur=0.14, type="sine") {
  try {
    if (!actx) actx = new AudioCtx();
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, actx.currentTime);
    gain.gain.setValueAtTime(0.18, actx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    osc.connect(gain); gain.connect(actx.destination);
    osc.start(); osc.stop(actx.currentTime + dur);
  } catch(e) {}
}

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
  const s = Math.min(window.innerWidth * 0.92, window.innerHeight * 0.74, 560);
  canvas.style.width = s + "px";
  canvas.style.height = s + "px";
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function loadLevel(idx) {
  solved = false;
  document.getElementById("win-modal").classList.remove("active");
  const raw = JSON.parse(JSON.stringify(LEVELS[idx % LEVELS.length]));
  state = raw;
  document.getElementById("lv-num").textContent = (idx + 1);
  document.getElementById("stars-num").textContent = totalStars;
  if (CATEGORY === "mind_app") {
    state.seq = [];
    const n = state.grid_size;
    const len = Math.min(7, 3 + Math.floor(idx / 3));
    for (let i=0; i<len; i++) {
      state.seq.push({x: (i*2 + idx) % n, y: (i + idx*3) % n});
    }
    state.userStep = 0;
    state.revealUntil = performance.now() + len * 650 + 600;
  }
  traceBeam();
}

// AdMob Ödüllü İpucu (LightPath_Android_Rewarded_StoryHint: ca-app-pub-8895372851932683/5761270122)
window.onRewardedHintGranted = function() {
  if (!state || solved) return;
  if (CATEGORY === "mind_app") {
    state.revealUntil = performance.now() + state.seq.length * 650 + 400;
    return;
  }
  const wrong = state.mirrors.find(m => m.initial_type !== m.solution_type);
  if (wrong) {
    wrong.initial_type = wrong.solution_type;
    playTone(680, 0.16, "triangle");
    traceBeam();
  }
};

document.getElementById("hint-btn").addEventListener("click", () => {
  if (window.AndroidAdMob && window.AndroidAdMob.showRewardedHint) {
    try {
      window.AndroidAdMob.showRewardedHint(ADMOB_CONFIG.rewardedAdUnitId);
      return;
    } catch(e) {}
  }
  window.onRewardedHintGranted();
});

function traceBeam() {
  if (!state) return;
  const n = state.grid_size;
  const dirs = [[1,0],[0,1],[-1,0],[0,-1]];
  const reflect = { 1: {0:3,3:0,1:2,2:1}, 2: {0:1,1:0,2:3,3:2} };
  let cx = state.source.x, cy = state.source.y, d = state.source.dir;
  state.beamPath = [{x: cx, y: cy}];
  let hitTarget = false;

  for (let step=0; step < n * n * 2; step++) {
    cx += dirs[d][0]; cy += dirs[d][1];
    if (cx < 0 || cy < 0 || cx >= n || cy >= n) {
      state.beamPath.push({x: Math.max(0, Math.min(n-1, cx)), y: Math.max(0, Math.min(n-1, cy))});
      break;
    }
    state.beamPath.push({x: cx, y: cy});
    if (cx === state.target.x && cy === state.target.y) {
      hitTarget = true;
      break;
    }
    const m = state.mirrors.find(item => item.x === cx && item.y === cy);
    if (m) d = reflect[m.initial_type][d];
  }

  if (hitTarget && !solved && CATEGORY !== "mind_app") {
    triggerWin();
  }
}

function triggerWin() {
  solved = true;
  totalStars += 3;
  localStorage.setItem("light_path_stars", String(totalStars));
  localStorage.setItem("light_path_lv", String(curIdx + 1));
  document.getElementById("stars-num").textContent = totalStars;
  playTone(523.25, 0.15, "triangle");
  setTimeout(() => playTone(659.25, 0.15, "triangle"), 120);
  setTimeout(() => playTone(783.99, 0.28, "triangle"), 240);
  for (let i=0; i<48; i++) {
    particles.push({
      x: 360, y: 360,
      vx: (Math.random() - 0.5) * 14,
      vy: (Math.random() - 0.5) * 14,
      r: 4 + Math.random() * 6,
      life: 1.0
    });
  }
  if (window.AndroidAdMob && window.AndroidAdMob.onLevelComplete) {
    try { window.AndroidAdMob.onLevelComplete(curIdx + 1); } catch(e) {}
  }
  setTimeout(() => {
    document.getElementById("win-modal").classList.add("active");
  }, 550);
}

canvas.addEventListener("pointerdown", (ev) => {
  if (!state || solved) return;
  const rect = canvas.getBoundingClientRect();
  const px = (ev.clientX - rect.left) / rect.width * canvas.width;
  const py = (ev.clientY - rect.top) / rect.height * canvas.height;
  const n = state.grid_size;
  const pad = 60;
  const cell = (canvas.width - pad * 2) / n;
  const gx = Math.floor((px - pad) / cell);
  const gy = Math.floor((py - pad) / cell);
  if (gx < 0 || gy < 0 || gx >= n || gy >= n) return;

  if (CATEGORY === "mind_app") {
    if (performance.now() < state.revealUntil) return;
    const expected = state.seq[state.userStep];
    if (expected && expected.x === gx && expected.y === gy) {
      playTone(440 + state.userStep * 80, 0.12);
      state.userStep++;
      if (state.userStep >= state.seq.length) triggerWin();
    } else {
      playTone(180, 0.25, "sawtooth");
      state.userStep = 0;
      state.revealUntil = performance.now() + state.seq.length * 600 + 400;
    }
    return;
  }

  const m = state.mirrors.find(item => item.x === gx && item.y === gy);
  if (m) {
    m.initial_type = m.initial_type === 1 ? 2 : 1;
    state.show_finger_hint = false;
    playTone(580, 0.09, "sine");
    traceBeam();
  }
});

document.getElementById("next-btn").addEventListener("click", () => {
  curIdx++;
  loadLevel(curIdx);
});

function render(now) {
  animT = now * 0.001;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (state) {
    const n = state.grid_size;
    const pad = 60;
    const cell = (canvas.width - pad * 2) / n;

    for (let y=0; y<n; y++) {
      for (let x=0; x<n; x++) {
        const cx = pad + x * cell;
        const cy = pad + y * cell;
        ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
        ctx.strokeStyle = "rgba(56, 189, 248, 0.24)";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.roundRect(cx + 8, cy + 8, cell - 16, cell - 16, 18);
        ctx.fill();
        ctx.stroke();
      }
    }

    if (CATEGORY === "mind_app") {
      const elapsed = state.revealUntil - now;
      state.seq.forEach((pt, idx) => {
        const show = elapsed > 0 && Math.floor((state.seq.length * 650 - elapsed) / 650) === idx;
        const done = elapsed <= 0 && idx < state.userStep;
        if (show || done) {
          const cx = pad + (pt.x + 0.5) * cell;
          const cy = pad + (pt.y + 0.5) * cell;
          ctx.fillStyle = "rgb(250, 204, 21)";
          ctx.shadowColor = "rgb(250, 204, 21)";
          ctx.shadowBlur = 28;
          ctx.beginPath();
          ctx.arc(cx, cy, cell * 0.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      });
    } else {
      if (state.beamPath && state.beamPath.length > 1) {
        ctx.save();
        ctx.strokeStyle = "rgb(250, 204, 21)";
        ctx.shadowColor = "rgb(250, 204, 21)";
        ctx.shadowBlur = 24;
        ctx.lineWidth = 10;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        state.beamPath.forEach((pt, i) => {
          const bx = pad + (pt.x + 0.5) * cell;
          const by = pad + (pt.y + 0.5) * cell;
          if (i === 0) ctx.moveTo(bx, by);
          else ctx.lineTo(bx, by);
        });
        ctx.stroke();
        ctx.restore();
      }

      const sx = pad + (state.source.x + 0.5) * cell;
      const sy = pad + (state.source.y + 0.5) * cell;
      ctx.fillStyle = "rgb(250, 204, 21)";
      ctx.beginPath();
      ctx.arc(sx, sy, cell * 0.24, 0, Math.PI * 2);
      ctx.fill();

      const tx = pad + (state.target.x + 0.5) * cell;
      const ty = pad + (state.target.y + 0.5) * cell;
      const pulse = 1 + 0.1 * Math.sin(animT * 5);
      ctx.fillStyle = "rgb(56, 189, 248)";
      ctx.beginPath();
      ctx.arc(tx, ty, cell * 0.26 * pulse, 0, Math.PI * 2);
      ctx.fill();

      state.mirrors.forEach((m, idx) => {
        const mx = pad + (m.x + 0.5) * cell;
        const my = pad + (m.y + 0.5) * cell;
        const r = cell * 0.28;
        ctx.save();
        ctx.strokeStyle = "#ffffff";
        ctx.shadowColor = "rgb(56, 189, 248)";
        ctx.shadowBlur = 18;
        ctx.lineWidth = 9;
        ctx.lineCap = "round";
        ctx.beginPath();
        if (m.initial_type === 1) {
          ctx.moveTo(mx - r, my + r);
          ctx.lineTo(mx + r, my - r);
        } else {
          ctx.moveTo(mx - r, my - r);
          ctx.lineTo(mx + r, my + r);
        }
        ctx.stroke();
        ctx.restore();

        if (state.show_finger_hint && idx === 0) {
          const bounce = Math.sin(animT * 6) * 10;
          ctx.font = "48px Segoe UI Emoji";
          ctx.textAlign = "center";
          ctx.fillText("👆", mx + 12, my + 56 + bounce);
        }
      });
    }
  }

  particles = particles.filter(p => p.life > 0.02);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.life *= 0.94;
    ctx.fillStyle = `rgba(250, 204, 21, ${p.life})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });

  requestAnimationFrame(render);
}

loadLevel(curIdx);
requestAnimationFrame(render);
</script>

<script>
(function() {
  let mttProg = 18;
  let mttAudioCtx = null;
  const handEl = document.getElementById('mtt-zero-text-onboarding');
  const barEl = document.getElementById('mtt-juice-progress-bar');

  function playJuiceChime(freq1, freq2, dur) {
    try {
      if (!mttAudioCtx) mttAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (mttAudioCtx.state === 'suspended') mttAudioCtx.resume();
      const osc = mttAudioCtx.createOscillator();
      const gain = mttAudioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq1, mttAudioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freq2, mttAudioCtx.currentTime + dur);
      gain.gain.setValueAtTime(0.14, mttAudioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, mttAudioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(mttAudioCtx.destination);
      osc.start();
      osc.stop(mttAudioCtx.currentTime + dur);
    } catch (e) {}
  }

  function spawnBurst(x, y) {
    const b = document.createElement('div');
    b.className = 'mtt-pickup-burst';
    b.style.left = (x || window.innerWidth / 2) + 'px';
    b.style.top = (y || window.innerHeight / 2) + 'px';
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 500);
  }

  function dismissOnboarding() {
    if (handEl && handEl.style.opacity !== '0') {
      handEl.style.opacity = '0';
      setTimeout(() => { if (handEl) handEl.style.display = 'none'; }, 460);
    }
  }

  // İlk 5 saniye sonra otomatik gizle
  setTimeout(dismissOnboarding, 5000);

  window.addEventListener('pointerdown', function(ev) {
    dismissOnboarding();
    spawnBurst(ev.clientX, ev.clientY);
    mttProg = mttProg >= 100 ? 20 : mttProg + 8;
    if (barEl) barEl.style.width = Math.min(100, mttProg) + '%';
    if (mttProg >= 100) {
      playJuiceChime(523.25, 1046.5, 0.28);
    } else {
      playJuiceChime(440, 660, 0.11);
    }
  }, { passive: true });
})();
</script>

    const hintPulse = document.getElementById('mtt-hint-pulse');
    const invCounts = { shards: 0, gears: 0, cores: 0 };
    let entities = [];
    let startTime = Date.now();
    let lastLevelTracked = -1;

    // Helper: Safely get game grid metrics
    function getMetrics() {
      if (!window.state || typeof window.state.grid_size === 'undefined') return null;
      const pad = 60;
      const cellSize = (720 - pad * 2) / window.state.grid_size;
      return { pad, cellSize, gridSize: window.state.grid_size };
    }

    function createEntity(type, gx, gy) {
      const e = { type, gx, gy, id: Math.random(), age: 0, collected: false, phase: Math.random() * Math.PI * 2 };
      if (type === 'patrol') { e.color = '#ef4444'; e.dir = 1; }
      if (type === 'orbit') { e.color = '#a855f7'; e.angle = 0; }
      if (type === 'teleport') { e.color = '#f97316'; e.timer = 0; e.visible = true; }
      if (type === 'boss') { e.color = '#22c55e'; e.hp = 3; e.scale = 1.5; }
      return e;
    }

    function spawnLevelEntities() {
      if (!window.state) return;
      entities = [];
      const m = getMetrics();
      if (!m) return;

      const isBossLevel = ((window.curIdx + 1) % 5 === 0);
      
      // Upgrade Materials (Shards)
      for(let i=0; i<3; i++) {
        entities.push(createEntity('shard', Math.floor(Math.random()*m.gridSize), Math.floor(Math.random()*m.gridSize)));
      }
      
      if (isBossLevel) {
        entities.push(createEntity('boss', Math.floor(m.gridSize/2), Math.floor(m.gridSize/2)));
      } else {
        // Normal Enemies
        if (window.curIdx > 1) entities.push(createEntity('patrol', 0, Math.floor(Math.random()*m.gridSize)));
        if (window.curIdx > 3) entities.push(createEntity('orbit', Math.floor(m.gridSize-1), 0));
        if (window.curIdx > 5) entities.push(createEntity('teleport', Math.floor(m.gridSize/2), Math.floor(m.gridSize/2)));
      }
    }

    function drawFace(ctx, x, y, size, mood = 'neutral') {
      ctx.fillStyle = 'white';
      const eyeSize = size * 0.15;
      ctx.beginPath(); ctx.arc(x - size*0.2, y - size*0.1, eyeSize, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + size*0.2, y - size*0.1, eyeSize, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'black';
      ctx.beginPath(); ctx.arc(x - size*0.2, y - size*0.1, eyeSize*0.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + size*0.2, y - size*0.1, eyeSize*0.5, 0, Math.PI*2); ctx.fill();
      
      ctx.strokeStyle = 'black';
      ctx.lineWidth = 2;
      ctx.beginPath();
      if (mood === 'angry') {
        ctx.moveTo(x - size*0.2, y + size*0.2); ctx.lineTo(x + size*0.2, y + size*0.15);
      } else if (mood === 'happy') {
        ctx.arc(x, y + size*0.1, size*0.2, 0.1*Math.PI, 0.9*Math.PI);
      } else {
        ctx.moveTo(x - size*0.2, y + size*0.2); ctx.lineTo(x + size*0.2, y + size*0.2);
      }
      ctx.stroke();
    }

    function update() {
      const m = getMetrics();
      if (!m || !window.canvas) { requestAnimationFrame(update); return; }

      // Sync canvas size
      const rect = window.canvas.getBoundingClientRect();
      fxCanvas.width = 720; fxCanvas.height = 720;
      fxCanvas.style.width = rect.width + 'px';
      fxCanvas.style.height = rect.height + 'px';
      fxCanvas.style.top = rect.top + 'px';
      fxCanvas.style.left = rect.left + 'px';

      if (window.curIdx !== lastLevelTracked) {
        lastLevelTracked = window.curIdx;
        spawnLevelEntities();
        if (window.curIdx === 0) {
          hintPulse.style.opacity = '1';
          setTimeout(() => hintPulse.style.opacity = '0', 5000);
        }
      }

      fxCtx.clearRect(0,0,720,720);
      const time = Date.now() * 0.002;

      // Pulse Hint Position
      if (hintPulse.style.opacity === '1' && window.state.mirrors.length > 0) {
        const h = window.state.mirrors[0];
        hintPulse.style.left = (rect.left + (m.pad + (h.x + 0.5) * m.cellSize) * (rect.width/720) - 60) + 'px';
        hintPulse.style.top = (rect.top + (m.pad + (h.y + 0.5) * m.cellSize) * (rect.height/720) - 60) + 'px';
      }

      entities.forEach(e => {
        if (e.collected) return;
        e.age += 0.016;

        let drawX = m.pad + (e.gx + 0.5) * m.cellSize;
        let drawY = m.pad + (e.gy + 0.5) * m.cellSize;

        if (e.type === 'patrol') {
          e.gx += e.dir * 0.02;
          if (e.gx > m.gridSize - 1 || e.gx < 0) e.dir *= -1;
        } else if (e.type === 'orbit') {
          e.angle += 0.03;
          drawX += Math.cos(e.angle) * m.cellSize * 0.4;
          drawY += Math.sin(e.angle) * m.cellSize * 0.4;
        } else if (e.type === 'teleport') {
          e.timer += 0.016;
          if (e.timer > 2) { e.timer = 0; e.visible = !e.visible; }
          if (!e.visible) return;
        }

        // Collection Logic (Beam collision)
        if (window.state.beamPath) {
          window.state.beamPath.forEach(pt => {
            const dist = Math.hypot(pt.x - e.gx, pt.y - e.gy);
            if (dist < 0.4) {
              e.collected = true;
              if (e.type === 'shard') {
                invCounts.shards++;
                if (invCounts.shards >= 3) { invCounts.shards = 0; invCounts.gears++; }
                if (invCounts.gears >= 2) { invCounts.gears = 0; invCounts.cores++; }
                document.getElementById('mtt-count-shards').innerText = invCounts.shards + '/3';
                document.getElementById('mtt-count-gears').innerText = invCounts.gears + '/2';
                document.getElementById('mtt-count-cores').innerText = invCounts.cores + '/1';
                if (window.playTone) window.playTone(800 + invCounts.shards*100, 0.1, 'square');
              }
            }
          });
        }

        // Render Entity
        fxCtx.save();
        fxCtx.shadowBlur = 15;
        fxCtx.shadowColor = e.color || '#fff';
        
        if (e.type === 'shard') {
          fxCtx.fillStyle = '#22d3ee';
          fxCtx.beginPath();
          fxCtx.moveTo(drawX, drawY - 20); fxCtx.lineTo(drawX + 15, drawY);
          fxCtx.lineTo(drawX, drawY + 20); fxCtx.lineTo(drawX - 15, drawY);
          fxCtx.fill();
        } else {
          fxCtx.fillStyle = e.color;
          const sz = (e.type === 'boss' ? m.cellSize * 0.8 : m.cellSize * 0.4);
          if (e.type === 'patrol') fxCtx.fillRect(drawX - sz/2, drawY - sz/2, sz, sz);
          else if (e.type === 'orbit') {
            fxCtx.beginPath();
            for(let i=0; i<3; i++) {
              let a = e.angle + i * (Math.PI*2/3);
              fxCtx.lineTo(drawX + Math.cos(a)*sz, drawY + Math.sin(a)*sz);
            }
            fxCtx.fill();
          } else if (e.type === 'boss') {
            fxCtx.beginPath();
            for(let i=0; i<6; i++) {
              let a = i * (Math.PI/3) + time;
              fxCtx.lineTo(drawX + Math.cos(a)*sz, drawY + Math.sin(a)*sz);
            }
            fxCtx.fill();
          } else {
            fxCtx.beginPath(); fxCtx.arc(drawX, drawY, sz/2, 0, Math.PI*2); fxCtx.fill();
          }
          drawFace(fxCtx, drawX, drawY, sz, (e.type === 'boss' ? 'angry' : 'neutral'));
        }
        fxCtx.restore();
      });

      requestAnimationFrame(update);
    }
    
    // Start loop
    requestAnimationFrame(update);

  } catch(err) { console.error("MTT Add-on Error:", err); }
})();
