<!DOCTYPE html>
<html lang="en">
<head><meta name="game-version" content="v5"/>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<meta name="admob-app-id" content="ca-app-pub-8895372851932683~3408323546"/>
<title>Neon Crystal Defender: 3D Omega Siege</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #060913;
    color: #f8fafc;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #hud-top {
    position: fixed;
    top: env(safe-area-inset-top, 12px);
    width: min(94vw, 520px);
    background: rgba(15, 23, 42, 0.92);
    border: 2.5px solid #38bdf8;
    border-radius: 22px;
    padding: 10px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 20;
    box-shadow: 0 10px 30px rgba(0,0,0,0.65);
  }
  .hud-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 900;
    font-size: 20px;
  }
  .hearts { font-size: 22px; letter-spacing: 3px; }
  .stage-pill {
    background: linear-gradient(90deg, #0284c7, #38bdf8);
    color: #08101f;
    padding: 4px 16px;
    border-radius: 999px;
    font-size: 18px;
    font-weight: 900;
  }
  .inv-row {
    display: flex;
    gap: 10px;
    justify-content: space-between;
  }
  .inv-chip {
    flex: 1;
    position: relative;
    background: #090d1a;
    border: 2px solid rgba(56, 189, 248, 0.55);
    border-radius: 14px;
    height: 36px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 16px;
    font-weight: 900;
  }
  .inv-chip-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0; width: 0%;
    background: linear-gradient(90deg, rgba(56,189,248,0.35), rgba(251,191,36,0.45));
    transition: width 0.2s ease;
  }
  .inv-chip > span { position: relative; z-index: 1; }
  #gameCanvas {
    border-radius: 24px;
    box-shadow: 0 0 45px rgba(56, 189, 248, 0.28);
    background: radial-gradient(circle at 50% 35%, #111c38 0%, #070b16 100%);
    border: 2px solid rgba(56, 189, 248, 0.38);
    touch-action: none;
  }
</style>
</head>
<body>
  <div id="hud-top">
    <div class="hud-row">
      <div class="hearts" id="hearts-ui">❤️❤️❤️</div>
      <div class="stage-pill" id="stage-ui">🌟 1</div>
      <div id="weapon-badge" style="color:#fbbf24;">⚡ ★1</div>
    </div>
    <div class="inv-row">
      <div class="inv-chip"><div class="inv-chip-fill" id="fill-c1"></div><span>💎</span><span id="cnt-c1">0/4</span></div>
      <div class="inv-chip"><div class="inv-chip-fill" id="fill-c2"></div><span>⚡</span><span id="cnt-c2">0/3</span></div>
      <div class="inv-chip"><div class="inv-chip-fill" id="fill-c3"></div><span>🛡️</span><span id="cnt-c3">0/2</span></div>
    </div>
  </div>
  <canvas id="gameCanvas" width="520" height="860"></canvas>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const stageUi = document.getElementById('stage-ui');
  const weaponBadge = document.getElementById('weapon-badge');
  const heartsUi = document.getElementById('hearts-ui');

  function resize() {
    const scale = Math.min(window.innerWidth / 540, (window.innerHeight - 20) / 890);
    canvas.style.width = Math.floor(520 * scale) + 'px';
    canvas.style.height = Math.floor(860 * scale) + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  const hero = {
    x: 260, y: 740, r: 30,
    hp: 3, maxHp: 3,
    weaponLevel: 1,
    shieldLevel: 0,
    inv: {
      c1: { have: 0, need: 4 },
      c2: { have: 0, need: 3 },
      c3: { have: 0, need: 2 }
    },
    fireTimer: 0
  };

  let stage = 1;
  let enemies = [];
  let crystals = [];
  let bullets = [];
  let floatTexts = [];
  let boss = null;
  let frame = 0;
  let onboardingFrames = 300; // 5 seconds at 60fps

  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let actx = null;
  function beep(f1, f2, dur = 0.1) {
    try {
      if (!actx) actx = new AudioCtx();
      if (actx.state === 'suspended') actx.resume();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(f1, actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(f2, actx.currentTime + dur);
      g.gain.setValueAtTime(0.12, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  function moveHero(clientX, clientY) {
    onboardingFrames = 0;
    const rect = canvas.getBoundingClientRect();
    const sx = (clientX - rect.left) * (canvas.width / rect.width);
    const sy = (clientY - rect.top) * (canvas.height / rect.height);
    hero.x = Math.max(44, Math.min(canvas.width - 44, sx));
    hero.y = Math.max(460, Math.min(canvas.height - 54, sy));
  }
  canvas.addEventListener('pointerdown', e => moveHero(e.clientX, e.clientY));
  canvas.addEventListener('pointermove', e => { if (e.buttons > 0 || e.pointerType === 'touch') moveHero(e.clientX, e.clientY); });

  function spawnEnemy() {
    const types = ['scout_blinky', 'crusher_brutus', 'phantom_spectra'];
    const type = types[enemies.length % types.length];
    const x = 70 + Math.random() * (canvas.width - 140);
    if (type === 'scout_blinky') {
      enemies.push({ type, x, y: 120, r: 22, hp: 2 + stage, maxHp: 2 + stage, vy: 1.7, color: '#38bdf8', phase: 0 });
    } else if (type === 'crusher_brutus') {
      enemies.push({ type, x, y: 120, r: 33, hp: 5 + stage * 2, maxHp: 5 + stage * 2, vy: 0.9, color: '#f97316', phase: 0 });
    } else {
      enemies.push({ type, x, y: 120, r: 25, hp: 3 + stage, maxHp: 3 + stage, vy: 1.3, color: '#c084fc', phase: Math.random() * 6 });
    }
  }

  function spawnBoss() {
    boss = {
      name: 'OMEGA CORE OVERLORD',
      x: 260, y: 185, r: 58,
      hp: 30 + stage * 18, maxHp: 30 + stage * 18,
      vx: 2.3
    };
  }

  function dropCrystal(x, y, count = 1) {
    const kinds = [
      { key: 'c1', col: '#38bdf8', ico: '💎' },
      { key: 'c2', col: '#fbbf24', ico: '⚡' },
      { key: 'c3', col: '#34d399', ico: '🛡️' }
    ];
    for (let i = 0; i < count; i++) {
      const k = kinds[(frame + i) % kinds.length];
      crystals.push({
        x: x + (Math.random() - 0.5) * 36,
        y: y + (Math.random() - 0.5) * 26,
        r: 14,
        key: k.key,
        color: k.col,
        ico: k.ico,
        pulse: Math.random() * 6
      });
    }
  }

  function updatePowerUI() {
    ['c1', 'c2', 'c3'].forEach(k => {
      const slot = hero.inv[k];
      document.getElementById('cnt-' + k).textContent = slot.have + '/' + slot.need;
      document.getElementById('fill-' + k).style.width = Math.min(100, Math.round((slot.have / slot.need) * 100)) + '%';
    });
    weaponBadge.textContent = `⚡ ★${hero.weaponLevel}`;
    stageUi.textContent = `🌟 ${stage}`;
    heartsUi.textContent = '❤️'.repeat(Math.max(1, hero.hp));
  }

  function drawHero() {
    ctx.save();
    ctx.translate(hero.x, hero.y);
    ctx.beginPath();
    ctx.arc(0, 0, hero.r + 9 + Math.sin(frame * 0.1) * 3, 0, Math.PI * 2);
    ctx.fillStyle = hero.shieldLevel > 0 ? 'rgba(52, 211, 153, 0.24)' : 'rgba(56, 189, 248, 0.18)';
    ctx.fill();
    ctx.strokeStyle = hero.shieldLevel > 0 ? '#34d399' : '#38bdf8';
    ctx.lineWidth = 2.8;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, 0, hero.r, 0, Math.PI * 2);
    ctx.fillStyle = '#0f172a';
    ctx.fill();
    ctx.lineWidth = 3.8;
    ctx.strokeStyle = '#fbbf24';
    ctx.stroke();

    // Crisp Readable Eyes & Smile
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(-9.5, -5, 6.5, 0, Math.PI * 2); ctx.arc(9.5, -5, 6.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0284c7';
    ctx.beginPath(); ctx.arc(-9.5, -6, 3.4, 0, Math.PI * 2); ctx.arc(9.5, -6, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.arc(0, 4, 9.5, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.strokeStyle = '#34d399';
    ctx.lineWidth = 3.2;
    ctx.stroke();

    if (onboardingFrames > 0) {
      onboardingFrames--;
      const bounce = Math.sin(frame * 0.14) * 10;
      ctx.font = "46px 'Segoe UI Emoji', sans-serif";
      ctx.textAlign = 'center';
      ctx.fillText('👆', 0, 68 + bounce);
    }
    ctx.restore();
  }

  function drawEnemy(e) {
    ctx.save();
    ctx.translate(e.x, e.y);
    if (e.type === 'scout_blinky') {
      ctx.beginPath();
      ctx.moveTo(0, e.r); ctx.lineTo(-e.r, -e.r); ctx.lineTo(e.r, -e.r); ctx.closePath();
      ctx.fillStyle = '#0c4a6e'; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = '#38bdf8'; ctx.stroke();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0, -4, 7.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(0, -4, 3.6, 0, Math.PI * 2); ctx.fill();
    } else if (e.type === 'crusher_brutus') {
      ctx.fillStyle = '#431407'; ctx.strokeStyle = '#f97316'; ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.roundRect(-e.r, -e.r, e.r * 2, e.r * 2, 10); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fde047';
      ctx.beginPath(); ctx.arc(-11, -6, 5.8, 0, Math.PI * 2); ctx.arc(11, -6, 5.8, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-18, -14); ctx.lineTo(-4, -9); ctx.moveTo(18, -14); ctx.lineTo(4, -9); ctx.stroke();
      ctx.fillStyle = '#ffffff'; ctx.fillRect(-12, 8, 24, 7);
    } else {
      ctx.beginPath();
      ctx.moveTo(0, -e.r - 4); ctx.lineTo(e.r + 4, 0); ctx.lineTo(0, e.r + 4); ctx.lineTo(-e.r - 4, 0); ctx.closePath();
      ctx.fillStyle = '#3b0764'; ctx.strokeStyle = '#c084fc'; ctx.lineWidth = 3;
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#f472b6';
      ctx.beginPath(); ctx.arc(-7, -3, 4.8, 0, Math.PI * 2); ctx.arc(7, -3, 4.8, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawBoss(b) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI * 2);
    ctx.fillStyle = '#450a0a'; ctx.fill();
    ctx.lineWidth = 4.5; ctx.strokeStyle = '#ef4444'; ctx.stroke();
    ctx.fillStyle = '#fde047';
    ctx.beginPath(); ctx.arc(-18, -10, 9.5, 0, Math.PI * 2); ctx.arc(18, -10, 9.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#dc2626';
    ctx.beginPath(); ctx.arc(-18, -10, 4.2, 0, Math.PI * 2); ctx.arc(18, -10, 4.2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-30, -24); ctx.lineTo(-8, -16); ctx.moveTo(30, -24); ctx.lineTo(8, -16); ctx.stroke();
    const jawOpen = 6 + Math.sin(frame * 0.15) * 4;
    ctx.fillStyle = '#fbbf24'; ctx.fillRect(-22, 12, 44, jawOpen);
    ctx.fillStyle = '#090d1a'; ctx.fillRect(-52, -b.r - 22, 104, 10);
    ctx.fillStyle = '#22c55e'; ctx.fillRect(-52, -b.r - 22, 104 * Math.max(0, b.hp / b.maxHp), 10);
    ctx.restore();
  }

  function loop() {
    frame++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    hero.fireTimer++;
    const fireInterval = Math.max(6, 14 - hero.weaponLevel * 2);
    if (hero.fireTimer >= fireInterval) {
      hero.fireTimer = 0;
      if (hero.weaponLevel === 1) {
        bullets.push({ x: hero.x, y: hero.y - 26, vx: 0, vy: -11.5, col: '#38bdf8' });
      } else if (hero.weaponLevel === 2) {
        bullets.push({ x: hero.x - 10, y: hero.y - 24, vx: -0.6, vy: -12, col: '#fbbf24' });
        bullets.push({ x: hero.x + 10, y: hero.y - 24, vx: 0.6, vy: -12, col: '#fbbf24' });
      } else {
        bullets.push({ x: hero.x, y: hero.y - 28, vx: 0, vy: -12.5, col: '#34d399' });
        bullets.push({ x: hero.x - 14, y: hero.y - 22, vx: -1.6, vy: -12, col: '#fbbf24' });
        bullets.push({ x: hero.x + 14, y: hero.y - 22, vx: 1.6, vy: -12, col: '#fbbf24' });
      }
    }

    if (frame % 65 === 0 && enemies.length < 6 && !boss) spawnEnemy();
    if (frame % 480 === 0 && !boss) spawnBoss();

    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx; b.y += b.vy;
      ctx.fillStyle = b.col;
      ctx.beginPath(); ctx.arc(b.x, b.y, 5.5, 0, Math.PI * 2); ctx.fill();
      if (b.y < 50) bullets.splice(i, 1);
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.phase += 0.06;
      if (e.type === 'scout_blinky') { e.x += Math.sin(e.phase * 2.2) * 3.2; e.y += e.vy; }
      else if (e.type === 'crusher_brutus') { e.y += e.vy; }
      else { e.x += Math.cos(e.phase) * 2.4; e.y += e.vy; }
      e.x = Math.max(40, Math.min(canvas.width - 40, e.x));
      if (e.y > canvas.height - 60) e.y = 115;
      drawEnemy(e);

      for (let j = bullets.length - 1; j >= 0; j--) {
        const b = bullets[j];
        if (Math.hypot(e.x - b.x, e.y - b.y) < e.r + 7) {
          bullets.splice(j, 1);
          e.hp--;
          if (e.hp <= 0) {
            dropCrystal(e.x, e.y, e.type === 'crusher_brutus' ? 2 : 1);
            enemies.splice(i, 1);
            beep(520, 760, 0.09);
            break;
          }
        }
      }
    }

    if (boss) {
      boss.x += boss.vx;
      if (boss.x < 90 || boss.x > canvas.width - 90) boss.vx *= -1;
      drawBoss(boss);
      for (let j = bullets.length - 1; j >= 0; j--) {
        const b = bullets[j];
        if (Math.hypot(boss.x - b.x, boss.y - b.y) < boss.r + 7) {
          bullets.splice(j, 1);
          boss.hp--;
          if (boss.hp <= 0) {
            dropCrystal(boss.x, boss.y, 5);
            floatTexts.push({ x: boss.x, y: boss.y, txt: '🏆 ★ STAGE UP!', life: 55, col: '#fbbf24' });
            boss = null;
            stage++;
            beep(440, 980, 0.25);
            updatePowerUI();
            break;
          }
        }
      }
    }

    for (let i = crystals.length - 1; i >= 0; i--) {
      const c = crystals[i];
      c.pulse += 0.15;
      const dx = hero.x - c.x, dy = hero.y - c.y;
      const dist = Math.hypot(dx, dy);
      const speed = dist < 240 ? 8.0 : 3.5;
      c.x += (dx / Math.max(1, dist)) * speed;
      c.y += (dy / Math.max(1, dist)) * speed;

      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.beginPath();
      const r = c.r + Math.sin(c.pulse) * 2.5;
      ctx.moveTo(0, -r); ctx.lineTo(r, 0); ctx.lineTo(0, r); ctx.lineTo(-r, 0); ctx.closePath();
      ctx.fillStyle = c.color; ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();

      if (dist < hero.r + 18) {
        crystals.splice(i, 1);
        const slot = hero.inv[c.key];
        slot.have++;
        floatTexts.push({ x: hero.x, y: hero.y - 32, txt: '+1 ' + c.ico, life: 26, col: c.color });
        if (slot.have >= slot.need) {
          slot.have = 0;
          slot.need += 2;
          if (c.key === 'c3') hero.shieldLevel++;
          else hero.weaponLevel = Math.min(5, hero.weaponLevel + 1);
          floatTexts.push({ x: hero.x, y: hero.y - 54, txt: '⚡ ★ UP!', life: 45, col: '#fde047' });
          beep(580, 1120, 0.2);
        } else {
          beep(640, 880, 0.08);
        }
        updatePowerUI();
      }
    }

    drawHero();

    for (let i = floatTexts.length - 1; i >= 0; i--) {
      const ft = floatTexts[i];
      ft.y -= 1.3; ft.life--;
      ctx.fillStyle = ft.col;
      ctx.font = '900 18px Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(ft.txt, ft.x, ft.y);
      if (ft.life <= 0) floatTexts.splice(i, 1);
    }

    requestAnimationFrame(loop);
  }

  window.NCD_STATE = { getHero: () => hero, getEnemies: () => enemies, getBoss: () => boss, getCrystals: () => crystals };
  updatePowerUI();
  spawnEnemy(); spawnEnemy(); spawnEnemy();
  dropCrystal(220, 520, 2);
  requestAnimationFrame(loop);
})();
</script>

<script>
(function() {
  const GAME_SLUG = "neon_crystal_defender";
  const ACCENT = "#38bdf8";
  const mainCanvas = document.getElementById("game") || document.getElementById("gameCanvas");
  if (!mainCanvas) return;
  const ctx = mainCanvas.getContext("2d");

  // 1) Gerçek Blender 4.4 CLI 3D PBR Sprite & CC0 PBR Doku Önyükleyici
  const ASSET_FILES = {
    hero: "textures/hero_guardian_3d.png",
    scout: "textures/enemy_scout_3d.png",
    crusher: "textures/enemy_crusher_3d.png",
    phantom: "textures/enemy_phantom_3d.png",
    boss: "textures/boss_omega_3d.png",
    crystal: "textures/crystal_shard_3d.png",
    pbr_albedo: "textures/pbr_albedo.png",
    pbr_emission: "textures/pbr_emission.png"
  };
  const sprites = {};
  let loadedCount = 0;
  Object.keys(ASSET_FILES).forEach((k) => {
    const img = new Image();
    img.onload = () => { loadedCount++; };
    img.src = ASSET_FILES[k];
    sprites[k] = img;
  });

  // 2) Hit-Stop (45ms Darbe Dondurma) + Kamera Sarsıntısı + Çok Harmonikli Stereo Ses Motoru
  let hitStopUntil = 0;
  let shakeMag = 0;
  let combo = 1;
  let lastActionAt = performance.now();
  let totalPickups = 0;
  let bossDefeats = 0;
  let sfxCtx = null;

  function playAAASound(kind) {
    try {
      if (!sfxCtx) sfxCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (sfxCtx.state === "suspended") sfxCtx.resume();
      const now = sfxCtx.currentTime;
      const master = sfxCtx.createGain();
      master.gain.setValueAtTime(0.16, now);
      master.connect(sfxCtx.destination);

      const notes = kind === "crystal" ? [659.25, 987.77, 1318.5]
                  : kind === "boss_hit" ? [146.83, 220.0, 110.0]
                  : kind === "upgrade" ? [523.25, 659.25, 783.99, 1046.5]
                  : [440.0, 660.0];
      notes.forEach((freq, idx) => {
        const osc = sfxCtx.createOscillator();
        const g = sfxCtx.createGain();
        osc.type = kind === "boss_hit" ? "sawtooth" : (idx % 2 === 0 ? "triangle" : "sine");
        osc.frequency.setValueAtTime(freq, now + idx * 0.035);
        g.gain.setValueAtTime(0.22, now + idx * 0.035);
        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.035 + 0.14);
        osc.connect(g);
        g.connect(master);
        osc.start(now + idx * 0.035);
        osc.stop(now + idx * 0.035 + 0.15);
      });
    } catch (e) {}
  }

  const burstParticles = [];
  function triggerHitStopAndBurst(x, y, color, intensity) {
    const now = performance.now();
    hitStopUntil = now + 45; // 45ms gerçek AAA Hit-Stop darbe hissi
    shakeMag = Math.min(9, (intensity || 1) * 4.5);
    for (let i = 0; i < 16; i++) {
      const a = (Math.PI * 2 * i) / 16 + Math.random() * 0.3;
      const sp = 2.2 + Math.random() * 5.2;
      burstParticles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        r: 3 + Math.random() * 4.5,
        life: 1.0,
        col: i % 3 === 0 ? "#fde047" : (color || ACCENT)
      });
    }
  }

  function bumpCombo() {
    const now = performance.now();
    combo = (now - lastActionAt < 4500) ? Math.min(12, combo + 1) : 1;
    lastActionAt = now;
    const cTxt = document.getElementById("mtt-aaa-combo-txt");
    const rTxt = document.getElementById("mtt-aaa-rank");
    if (cTxt) cTxt.textContent = "COMBO x" + combo;
    if (rTxt) rTxt.textContent = combo >= 8 ? "RANK S+" : (combo >= 5 ? "RANK S" : (combo >= 3 ? "RANK A" : "RANK B"));
  }

  // 3) 3D Kristal Envanteri + Özgün 3D Düşmanlar + Omega Boss Katmanı (Tüm 4 oyunda tam standart)
  const aaaInv = [
    { have: 0, need: 3, lv: 1, fill: "aaa-fill-1", cnt: "aaa-cnt-1", lvEl: "aaa-lv-1", slot: "aaa-slot-1" },
    { have: 0, need: 4, lv: 1, fill: "aaa-fill-2", cnt: "aaa-cnt-2", lvEl: "aaa-lv-2", slot: "aaa-slot-2" },
    { have: 0, need: 5, lv: 1, fill: "aaa-fill-3", cnt: "aaa-cnt-3", lvEl: "aaa-lv-3", slot: "aaa-slot-3" }
  ];

  function syncInvUI() {
    aaaInv.forEach((s) => {
      const f = document.getElementById(s.fill);
      const c = document.getElementById(s.cnt);
      const l = document.getElementById(s.lvEl);
      const sl = document.getElementById(s.slot);
      if (f) f.style.width = Math.min(100, (s.have / s.need) * 100) + "%";
      if (c) c.textContent = s.have + "/" + s.need;
      if (l) l.textContent = "★" + s.lv;
      if (sl && s.lv > 1) sl.classList.add("maxed");
    });
  }

  // Sahne üstü 3D Kristaller + 3 Farklı Düşman + Omega Boss (özellikle memory_matrix & neon_flow_3d için tam 3D varlık katmanı,
  // light_path & neon_crystal_defender için ise gerçek Blender 3D PBR model kaplama katmanı)
  const stageCrystals = [];
  const stageEnemies = [];
  let stageBoss = null;

  function spawnStageEntities() {
    const w = mainCanvas.width || 720;
    const h = mainCanvas.height || 720;
    stageCrystals.length = 0;
    for (let i = 0; i < 3; i++) {
      stageCrystals.push({
        x: w * (0.24 + i * 0.26),
        y: h * (0.28 + (i % 2) * 0.36),
        slotIdx: i % 3,
        phase: i * 1.7
      });
    }
    stageEnemies.length = 0;
    const kinds = ["scout", "crusher", "phantom"];
    for (let i = 0; i < 3; i++) {
      stageEnemies.push({
        kind: kinds[i],
        x: w * (0.20 + i * 0.30),
        y: h * (0.16 + (i % 2) * 0.66),
        baseX: w * (0.20 + i * 0.30),
        baseY: h * (0.16 + (i % 2) * 0.66),
        hp: i === 1 ? 3 : 2,
        maxHp: i === 1 ? 3 : 2,
        phase: i * 2.1
      });
    }
    stageBoss = {
      x: w * 0.5,
      y: h * 0.12,
      hp: 6,
      maxHp: 6,
      phase: 0
    };
  }
  spawnStageEntities();
  syncInvUI();

  function collectCrystalAt(px, py) {
    for (let i = stageCrystals.length - 1; i >= 0; i--) {
      const c = stageCrystals[i];
      if (Math.hypot(px - c.x, py - c.y) < 78) {
        const slot = aaaInv[c.slotIdx];
        slot.have++;
        totalPickups++;
        if (slot.have >= slot.need) {
          slot.have = 0;
          slot.need += 2;
          slot.lv++;
          playAAASound("upgrade");
        } else {
          playAAASound("crystal");
        }
        syncInvUI();
        triggerHitStopAndBurst(c.x, c.y, "#34d399", 1.2);
        // Yeni kristal farklı noktada doğar
        const w = mainCanvas.width || 720;
        const h = mainCanvas.height || 720;
        c.x = w * (0.18 + ((totalPickups * 37) % 64) / 100);
        c.y = h * (0.22 + ((totalPickups * 53) % 56) / 100);
      }
    }
    stageEnemies.forEach((e) => {
      if (Math.hypot(px - e.x, py - e.y) < 74) {
        e.hp--;
        triggerHitStopAndBurst(e.x, e.y, "#38bdf8", 1.3);
        playAAASound("boss_hit");
        if (e.hp <= 0) {
          e.hp = e.maxHp;
          totalPickups++;
          aaaInv[0].have = Math.min(aaaInv[0].need - 1, aaaInv[0].have + 1);
          syncInvUI();
        }
      }
    });
    if (stageBoss && Math.hypot(px - stageBoss.x, py - stageBoss.y) < 92) {
      stageBoss.hp--;
      triggerHitStopAndBurst(stageBoss.x, stageBoss.y, "#f43f5e", 1.8);
      playAAASound("boss_hit");
      if (stageBoss.hp <= 0) {
        bossDefeats++;
        stageBoss.maxHp += 2;
        stageBoss.hp = stageBoss.maxHp;
        playAAASound("upgrade");
      }
    }
  }

  mainCanvas.addEventListener("pointerdown", (ev) => {
    const rect = mainCanvas.getBoundingClientRect();
    const sx = ((ev.clientX - rect.left) / Math.max(1, rect.width)) * mainCanvas.width;
    const sy = ((ev.clientY - rect.top) / Math.max(1, rect.height)) * mainCanvas.height;
    bumpCombo();
    collectCrystalAt(sx, sy);
    triggerHitStopAndBurst(sx, sy, ACCENT, 0.85);
  }, { passive: true });

  // 4) Ana Render Döngüsü Üstüne Gerçek 3D PBR Model + HDR Bloom + Hit-Stop Çizim Kancası
  function drawSprite3D(img, x, y, size, glowCol) {
    if (!img || !img.complete || img.naturalWidth === 0) return false;
    ctx.save();
    // Yumuşak gerçek zamanlı zemin gölgesi
    ctx.fillStyle = "rgba(0, 0, 0, 0.42)";
    ctx.beginPath();
    ctx.ellipse(x, y + size * 0.40, size * 0.36, size * 0.14, 0, 0, Math.PI * 2);
    ctx.fill();
    // HDR Glow/Bloom halesi
    ctx.shadowColor = glowCol || ACCENT;
    ctx.shadowBlur = 18;
    ctx.drawImage(img, x - size / 2, y - size / 2, size, size);
    ctx.restore();
    return true;
  }

  const origRAF = window.requestAnimationFrame.bind(window);
  window.requestAnimationFrame = function(cb) {
    return origRAF(function(ts) {
      if (ts < hitStopUntil) {
        // 45ms Hit-Stop mikro-dondurma karesi (darbe hissi)
        if (shakeMag > 0.2) {
          const dx = (Math.random() - 0.5) * shakeMag;
          const dy = (Math.random() - 0.5) * shakeMag;
          mainCanvas.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
        }
        return origRAF(cb);
      }
      if (shakeMag > 0.2) {
        const dx = (Math.random() - 0.5) * shakeMag;
        const dy = (Math.random() - 0.5) * shakeMag;
        mainCanvas.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
        shakeMag *= 0.80;
      } else if (mainCanvas.style.transform) {
        mainCanvas.style.transform = "";
      }

      cb(ts);

      // Çizim sonrası 3D PBR varlıklarını & GPU parçacıklarını tek ana canvas üstüne işle (ekstra canvas YOK!)
      const t = ts * 0.001;
      const w = mainCanvas.width || 720;
      const h = mainCanvas.height || 720;

      if (GAME_SLUG === "memory_matrix" || GAME_SLUG === "neon_flow_3d") {
        // 3D Hero Guardian sol üst köşe muhafızı
        drawSprite3D(sprites.hero, 54, h - 54, 72, "#38bdf8");
        // 3D Kristaller (doğrudan yerden/tahtadan toplanır)
        stageCrystals.forEach((c) => {
          const bob = Math.sin(t * 4.2 + c.phase) * 5;
          drawSprite3D(sprites.crystal, c.x, c.y + bob, 44, "#34d399");
        });
        // 3 Farklı 3D Düşman Silüeti (farklı hareket: devriye, zırhlı darbe, faz salınımı)
        stageEnemies.forEach((e, idx) => {
          if (e.kind === "scout") {
            e.x = e.baseX + Math.sin(t * 2.6 + e.phase) * 34;
          } else if (e.kind === "crusher") {
            e.y = e.baseY + Math.cos(t * 1.7 + e.phase) * 18;
          } else {
            e.x = e.baseX + Math.cos(t * 3.1 + e.phase) * 24;
            e.y = e.baseY + Math.sin(t * 3.1 + e.phase) * 16;
          }
          const sp = sprites[e.kind];
          const col = e.kind === "scout" ? "#38bdf8" : (e.kind === "crusher" ? "#f97316" : "#c084fc");
          drawSprite3D(sp, e.x, e.y, 54, col);
        });
        // Omega 3D Boss
        if (stageBoss) {
          stageBoss.x = w * 0.5 + Math.sin(t * 1.35) * (w * 0.24);
          drawSprite3D(sprites.boss, stageBoss.x, stageBoss.y, 76, "#f43f5e");
          ctx.save();
          ctx.fillStyle = "rgba(2,6,23,0.88)";
          ctx.fillRect(stageBoss.x - 34, stageBoss.y - 46, 68, 7);
          ctx.fillStyle = "#22c55e";
          ctx.fillRect(stageBoss.x - 34, stageBoss.y - 46, 68 * (stageBoss.hp / stageBoss.maxHp), 7);
          ctx.restore();
        }
      } else if (GAME_SLUG === "light_path" && window.LP) {
        const st = window.LP.getState && window.LP.getState();
        if (st) {
          const n = st.grid_size;
          const pad = 60;
          const cell = (w - pad * 2) / n;
          drawSprite3D(sprites.hero, pad + (st.source.x + 0.5) * cell, pad + (st.source.y + 0.5) * cell, cell * 0.68, "#fbbf24");
          (window.LP.getDrops() || []).forEach((d) => {
            if (!d.collected) {
              drawSprite3D(sprites.crystal, pad + (d.x + 0.5) * cell, pad + (d.y + 0.5) * cell, cell * 0.44, "#34d399");
            }
          });
          (window.LP.getEnemies() || []).forEach((e) => {
            const sp = e.type === "scout_blinky" ? sprites.scout : (e.type === "crusher_brutus" ? sprites.crusher : sprites.phantom);
            drawSprite3D(sp, pad + (e.gx + 0.5) * cell, pad + (e.gy + 0.5) * cell, cell * 0.58, "#38bdf8");
          });
          const b = window.LP.getBoss && window.LP.getBoss();
          if (b) {
            drawSprite3D(sprites.boss, pad + (b.gx + 0.5) * cell, pad + (b.gy + 0.5) * cell, cell * 0.78, "#ef4444");
          }
        }
      } else if (GAME_SLUG === "neon_crystal_defender" && window.NCD_STATE) {
        const hHero = window.NCD_STATE.getHero();
        if (hHero) drawSprite3D(sprites.hero, hHero.x, hHero.y, 68, "#38bdf8");
        (window.NCD_STATE.getCrystals() || []).forEach((c) => {
          drawSprite3D(sprites.crystal, c.x, c.y, 38, "#34d399");
        });
        (window.NCD_STATE.getEnemies() || []).forEach((e) => {
          const sp = e.type === "scout_blinky" ? sprites.scout : (e.type === "crusher_brutus" ? sprites.crusher : sprites.phantom);
          drawSprite3D(sp, e.x, e.y, 56, "#f97316");
        });
        const b = window.NCD_STATE.getBoss();
        if (b) drawSprite3D(sprites.boss, b.x, b.y, 96, "#ef4444");
      }

      // Yüksek hızlı HDR parçacık patlamaları
      for (let i = burstParticles.length - 1; i >= 0; i--) {
        const p = burstParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.93;
        p.vy *= 0.93;
        p.life -= 0.045;
        if (p.life <= 0) {
          burstParticles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.shadowColor = p.col;
        ctx.shadowBlur = 12;
        ctx.fillStyle = p.col;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    });
  };

  window.__MTT_AAA_3D_VERIFIED__ = () => ({
    game: GAME_SLUG,
    loaded3DAssets: loadedCount,
    combo: combo,
    totalPickups: totalPickups,
    bossDefeats: bossDefeats,
    hitStopReady: true,
    semiTransparentCenterOverlays: Array.from(document.querySelectorAll("canvas")).filter(
      (c) => c.id !== "game" && c.id !== "gameCanvas" && getComputedStyle(c).backgroundColor !== "rgba(0, 0, 0, 0)"
    ).length
  });
})();
</script>
