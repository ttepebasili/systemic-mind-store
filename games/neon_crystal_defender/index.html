<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="game-version" content="v13"/>
<meta name="admob-publisher" content="pub-8895372851932683"/>
<title>Prism Bastion: Crystal Defender 3D — Prism Veld Studio (v13)</title>
<style>
  :root {
    --bg: #080c18;
    --panel: rgba(15, 23, 42, 0.92);
    --text: #f8fafc;
    --hero: #38bdf8;
    --shard: #2dd4bf;
    --enemy: #f43f5e;
    --boss: #facc15;
  }
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; }
  #hud-bar {
    position: fixed; top: 12px; left: 12px; right: 12px; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--panel); border: 1px solid rgba(56, 189, 248, 0.42);
    border-radius: 16px; padding: 8px 14px; min-height: 56px;
  }
  .hud-pill {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 700; letter-spacing: 0.3px; color: var(--text);
  }
  .hud-actions { display: inline-flex; gap: 8px; }
  .hud-btn {
    min-height: 56px; min-width: 104px; padding: 0 14px;
    border-radius: 14px; border: 2px solid var(--hero);
    background: rgba(56, 189, 248, 0.16); color: var(--text);
    font-size: 14px; font-weight: 800; cursor: pointer;
  }
  .hud-btn-gold { border-color: var(--boss); background: rgba(250, 204, 21, 0.16); color: var(--boss); }
  .hud-btn:active { transform: scale(0.96); }
  #admob-banner-slot {
    position: fixed; bottom: 0; left: 0; right: 0; height: 50px; z-index: 20;
    background: rgba(8, 12, 24, 0.94); border-top: 1px solid rgba(56, 189, 248, 0.25);
    display: flex; align-items: center; justify-content: center; font-size: 12px; color: #94a3b8;
  }
  canvas#board { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--bg); }
  canvas.fx-overlay { position: fixed; inset: 0; width: 100%; height: 100%; background: transparent !important; border: none !important; pointer-events: none; z-index: 10; }
</style>
</head>
<body>
<header id="hud-bar" role="region" aria-label="Game Progress HUD">
  <div class="hud-pill" data-hud-counter="shards">
    <span>💎</span>
    <span id="shard-counter">have 0 / need 5</span>
  </div>
  <div class="hud-pill">
    <span>🏆 Lv.<b id="stage-num">1</b></span>
    <span style="opacity:0.78;font-size:12px" id="fps-badge">60 FPS</span>
  </div>
  <div class="hud-actions">
    <button class="hud-btn hud-btn-gold" id="reward-btn" type="button" aria-label="Rewarded Overdrive Boost">🛡️ OVERDRIVE</button>
    <button class="hud-btn" id="pulse-btn" type="button" aria-label="Trigger Prism Pulse">⚡ PULSE</button>
  </div>
</header>
<canvas id="board"></canvas>
<canvas class="fx-overlay" id="fx"></canvas>
<footer id="admob-banner-slot" data-admob-banner="ca-app-pub-8895372851932683/4419827361">
  Prism Veld Studio • 60 FPS Sovereign Optics Engine
</footer>
<script>
(() => {
  "use strict";
  window.__PRISM_ADMOB_SPEC__ = {
    publisherId: "pub-8895372851932683",
    appId: "ca-app-pub-8895372851932683~3408323546",
    bannerUnit: "ca-app-pub-8895372851932683/4419827361",
    interstitialUnit: "ca-app-pub-8895372851932683/7738192045",
    rewardedUnit: "ca-app-pub-8895372851932683/5761270122"
  };

  class ObjectPool {
    constructor(factory, size) {
      this.pool = Array.from({ length: size }, () => factory());
      this.activeCount = 0;
    }
    acquire() {
      if (this.activeCount >= this.pool.length) return null;
      const item = this.pool[this.activeCount++];
      item.active = true;
      return item;
    }
    releaseAt(index) {
      if (index < 0 || index >= this.activeCount) return;
      const last = this.activeCount - 1;
      const temp = this.pool[index];
      temp.active = false;
      this.pool[index] = this.pool[last];
      this.pool[last] = temp;
      this.activeCount--;
    }
  }

  const board = document.getElementById("board");
  const ctx = board.getContext("2d", { alpha: false });
  const shardEl = document.getElementById("shard-counter");
  const stageEl = document.getElementById("stage-num");
  const fpsEl = document.getElementById("fps-badge");
  const pulseBtn = document.getElementById("pulse-btn");
  const rewardBtn = document.getElementById("reward-btn");

  let W = window.innerWidth, H = window.innerHeight;
  let audioMutedForAd = false;
  window.__PRISM_SET_MUTE__ = (flag) => { audioMutedForAd = Boolean(flag); };

  const resize = () => {
    W = board.width = window.innerWidth;
    H = board.height = window.innerHeight;
  };
  window.addEventListener("resize", resize, { passive: true });
  resize();

  if (window.PrismVeldAdBridge && typeof window.PrismVeldAdBridge.showBannerAd === "function") {
    try { window.PrismVeldAdBridge.showBannerAd(); } catch (e) {}
  }

  const heroSilhouette = { x: W * 0.5, y: H * 0.68, tx: W * 0.5, ty: H * 0.68, r: 25, angle: 0, shield: 0, beamLen: 150 };
  const enemyArchetypes = [
    { kind: "refract_scout", color: "#f43f5e", sides: 3, speed: 138, r: 18 },
    { kind: "void_prism", color: "#c084fc", sides: 4, speed: 108, r: 20 },
    { kind: "obsidian_warden", color: "#fb923c", sides: 6, speed: 84, r: 24 }
  ];
  const bossEntity = { active: false, x: W * 0.5, y: 156, r: 46, hp: 3, phase: 0, color: "#facc15" };

  const particlePool = new ObjectPool(() => ({ active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, color: "#38bdf8" }), 200);
  const shardPool = new ObjectPool(() => ({ active: false, x: 0, y: 0, pulse: 0 }), 28);
  const enemyPool = new ObjectPool(() => ({ active: false, x: 0, y: 0, vx: 0, vy: 0, arch: 0, rot: 0 }), 28);

  let stage = 1, have = 0, need = 5;
  const syncHud = () => {
    shardEl.textContent = `have ${have} / need ${need}`;
    stageEl.textContent = String(stage);
  };

  const spawnBurst = (x, y, color) => {
    for (let i = 0; i < 14; i++) {
      const p = particlePool.acquire();
      if (!p) break;
      const a = (Math.PI * 2 * i) / 14;
      p.x = x; p.y = y;
      p.vx = Math.cos(a) * 175; p.vy = Math.sin(a) * 175;
      p.life = 0.48; p.color = color;
    }
  };

  window.onRewardedAdGranted = () => {
    heroSilhouette.shield = 6.0;
    heroSilhouette.beamLen = 280;
    spawnBurst(heroSilhouette.x, heroSilhouette.y, "#facc15");
  };

  rewardBtn.addEventListener("click", () => {
    if (window.PrismVeldAdBridge && typeof window.PrismVeldAdBridge.showRewardedAd === "function") {
      try { window.PrismVeldAdBridge.showRewardedAd(); return; } catch (e) {}
    }
    if (window.__PORTAL_REWARDED_AD__) {
      window.__PORTAL_REWARDED_AD__(window.onRewardedAdGranted);
      return;
    }
    window.onRewardedAdGranted();
  });

  const populateStage = () => {
    shardPool.activeCount = 0;
    enemyPool.activeCount = 0;
    need = 4 + Math.min(stage, 7);
    have = 0;
    for (let i = 0; i < need; i++) {
      const s = shardPool.acquire();
      if (!s) break;
      s.x = 64 + ((i * 149 + stage * 59) % Math.max(W - 128, 120));
      s.y = 116 + ((i * 197 + stage * 73) % Math.max(H - 250, 140));
      s.pulse = i * 0.65;
    }
    const enemyTotal = Math.min(2 + Math.floor(stage / 2), 8);
    for (let i = 0; i < enemyTotal; i++) {
      const e = enemyPool.acquire();
      if (!e) break;
      e.arch = i % enemyArchetypes.length;
      const spec = enemyArchetypes[e.arch];
      e.x = 72 + ((i * 181) % Math.max(W - 144, 120));
      e.y = 132 + ((i * 117) % Math.max(H * 0.44, 120));
      e.vx = (i % 2 === 0 ? 1 : -1) * spec.speed;
      e.vy = (i % 3 === 0 ? 0.68 : -0.68) * spec.speed;
      e.rot = 0;
    }
    bossEntity.active = (stage % 3 === 0);
    bossEntity.hp = 3;
    bossEntity.x = W * 0.5;
    syncHud();
  };

  const setTarget = (clientX, clientY) => {
    heroSilhouette.tx = Math.max(32, Math.min(W - 32, clientX));
    heroSilhouette.ty = Math.max(92, Math.min(H - 68, clientY));
  };
  board.addEventListener("pointerdown", (ev) => setTarget(ev.clientX, ev.clientY), { passive: true });
  board.addEventListener("pointermove", (ev) => { if (ev.buttons) setTarget(ev.clientX, ev.clientY); }, { passive: true });
  pulseBtn.addEventListener("click", () => {
    heroSilhouette.shield = Math.max(heroSilhouette.shield, 1.5);
    spawnBurst(heroSilhouette.x, heroSilhouette.y, "#38bdf8");
    if (bossEntity.active && Math.hypot(bossEntity.x - heroSilhouette.x, bossEntity.y - heroSilhouette.y) < 240) {
      bossEntity.hp--;
      spawnBurst(bossEntity.x, bossEntity.y, "#facc15");
      if (bossEntity.hp <= 0) bossEntity.active = false;
    }
  });

  const drawPoly3D = (x, y, r, sides, rot, fill, rim) => {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.beginPath();
    for (let i = 0; i < sides; i++) {
      const a = (Math.PI * 2 * i) / sides;
      const px = Math.cos(a) * r + 5, py = Math.sin(a) * r + 7;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = fill;
    ctx.strokeStyle = rim;
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i < sides; i++) {
      const a = (Math.PI * 2 * i) / sides;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#080c18";
    ctx.beginPath();
    ctx.arc(-r * 0.26, -r * 0.12, 3.3, 0, Math.PI * 2);
    ctx.arc(r * 0.26, -r * 0.12, 3.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  };

  populateStage();
  let lastTime = performance.now();
  let fpsAccum = 0, fpsFrames = 0;

  const loop = (now) => {
    const dtClamp = Math.min(Math.max((now - lastTime) / 1000, 0.001), 0.05);
    lastTime = now;
    if (audioMutedForAd) {
      requestAnimationFrame(loop);
      return;
    }
    fpsAccum += dtClamp; fpsFrames++;
    if (fpsAccum >= 0.5) {
      fpsEl.textContent = `${Math.min(60, Math.round(fpsFrames / fpsAccum))} FPS`;
      fpsAccum = 0; fpsFrames = 0;
    }

    heroSilhouette.x += (heroSilhouette.tx - heroSilhouette.x) * Math.min(1, dtClamp * 11.5);
    heroSilhouette.y += (heroSilhouette.ty - heroSilhouette.y) * Math.min(1, dtClamp * 11.5);
    heroSilhouette.angle += dtClamp * 1.9;
    if (heroSilhouette.shield > 0) heroSilhouette.shield = Math.max(0, heroSilhouette.shield - dtClamp);

    ctx.fillStyle = "#080c18";
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = "rgba(56, 189, 248, 0.08)";
    ctx.lineWidth = 1;
    for (let gx = 0; gx < W; gx += 64) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
    for (let gy = 80; gy < H - 50; gy += 64) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); }

    // Optical refraction ray
    const bx = heroSilhouette.x + Math.cos(heroSilhouette.angle) * heroSilhouette.beamLen;
    const by = heroSilhouette.y + Math.sin(heroSilhouette.angle) * heroSilhouette.beamLen;
    ctx.strokeStyle = "rgba(250, 204, 21, 0.45)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(heroSilhouette.x, heroSilhouette.y);
    ctx.lineTo(bx, by);
    ctx.stroke();

    for (let i = shardPool.activeCount - 1; i >= 0; i--) {
      const s = shardPool.pool[i];
      s.pulse += dtClamp * 4.2;
      const sr = 14 + Math.sin(s.pulse) * 2.5;
      drawPoly3D(s.x, s.y, sr, 4, s.pulse * 0.5, "#2dd4bf", "#f8fafc");
      if (Math.hypot(s.x - heroSilhouette.x, s.y - heroSilhouette.y) < heroSilhouette.r + sr + 8) {
        spawnBurst(s.x, s.y, "#2dd4bf");
        shardPool.releaseAt(i);
        have++;
        syncHud();
        if (have >= need) {
          if (stage % 2 === 0) {
            if (window.PrismVeldAdBridge && typeof window.PrismVeldAdBridge.showInterstitialAd === "function") {
              try { window.PrismVeldAdBridge.showInterstitialAd(stage); } catch (e) {}
            } else if (window.__PORTAL_MIDGAME_AD__) {
              window.__PORTAL_MIDGAME_AD__();
            }
          }
          stage++;
          populateStage();
          break;
        }
      }
    }

    for (let i = 0; i < enemyPool.activeCount; i++) {
      const e = enemyPool.pool[i];
      const spec = enemyArchetypes[e.arch];
      e.x += e.vx * dtClamp;
      e.y += e.vy * dtClamp;
      if (e.x < 36 || e.x > W - 36) e.vx *= -1;
      if (e.y < 96 || e.y > H - 72) e.vy *= -1;
      e.rot += dtClamp * 2.5;
      drawPoly3D(e.x, e.y, spec.r, spec.sides, e.rot, spec.color, "#ffe4e6");
      if (heroSilhouette.shield <= 0 && Math.hypot(e.x - heroSilhouette.x, e.y - heroSilhouette.y) < spec.r + heroSilhouette.r - 4) {
        heroSilhouette.shield = 0.85;
        spawnBurst(heroSilhouette.x, heroSilhouette.y, "#f43f5e");
      }
    }

    if (bossEntity.active) {
      bossEntity.phase += dtClamp * 1.7;
      bossEntity.x = W * 0.5 + Math.sin(bossEntity.phase) * Math.min(185, W * 0.32);
      drawPoly3D(bossEntity.x, bossEntity.y, bossEntity.r, 8, -bossEntity.phase * 0.6, bossEntity.color, "#fef08a");
    }

    if (heroSilhouette.shield > 0) {
      ctx.strokeStyle = "rgba(250, 204, 21, 0.85)";
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.arc(heroSilhouette.x, heroSilhouette.y, heroSilhouette.r + 13, 0, Math.PI * 2);
      ctx.stroke();
    }
    drawPoly3D(heroSilhouette.x, heroSilhouette.y, heroSilhouette.r, 5, heroSilhouette.angle * 0.3, "#38bdf8", "#facc15");

    for (let i = particlePool.activeCount - 1; i >= 0; i--) {
      const p = particlePool.pool[i];
      p.life -= dtClamp;
      if (p.life <= 0) { particlePool.releaseAt(i); continue; }
      p.x += p.vx * dtClamp; p.y += p.vy * dtClamp;
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, p.life * 2);
      ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
      ctx.globalAlpha = 1;
    }

    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
