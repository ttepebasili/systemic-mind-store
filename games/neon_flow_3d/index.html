const CATEGORY = "puzzle_game";
let curIdx = parseInt(localStorage.getItem("neon_flow_3d_lv") || "0", 10) % LEVELS.length;
let totalStars = parseInt(localStorage.getItem("neon_flow_3d_stars") || "0", 10);
let state = null;
let particles = [];
let solved = false;
let animT = 0;

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
function playTone(freq, dur=0.14, type="sine") {
  try {
    if (!actx) actx = new AudioCtx();
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, actx.currentTime);
    gain.gain.setValueAtTime(0.18, actx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    osc.connect(gain); gain.connect(actx.destination);
    osc.start(); osc.stop(actx.currentTime + dur);
  } catch(e) {}
}

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
  const s = Math.min(window.innerWidth * 0.92, window.innerHeight * 0.74, 560);
  canvas.style.width = s + "px";
  canvas.style.height = s + "px";
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function loadLevel(idx) {
  solved = false;
  document.getElementById("win-modal").classList.remove("active");
  const raw = JSON.parse(JSON.stringify(LEVELS[idx % LEVELS.length]));
  state = raw;
  document.getElementById("lv-num").textContent = (idx + 1);
  document.getElementById("stars-num").textContent = totalStars;
  if (CATEGORY === "mind_app") {
    state.seq = [];
    const n = state.grid_size;
    const len = Math.min(7, 3 + Math.floor(idx / 3));
    for (let i=0; i<len; i++) {
      state.seq.push({x: (i*2 + idx) % n, y: (i + idx*3) % n});
    }
    state.userStep = 0;
    state.revealUntil = performance.now() + len * 650 + 600;
  }
  traceBeam();
}

// AdMob Ödüllü İpucu (LightPath_Android_Rewarded_StoryHint: ca-app-pub-8895372851932683/5761270122)
window.onRewardedHintGranted = function() {
  if (!state || solved) return;
  if (CATEGORY === "mind_app") {
    state.revealUntil = performance.now() + state.seq.length * 650 + 400;
    return;
  }
  const wrong = state.mirrors.find(m => m.initial_type !== m.solution_type);
  if (wrong) {
    wrong.initial_type = wrong.solution_type;
    playTone(680, 0.16, "triangle");
    traceBeam();
  }
};

document.getElementById("hint-btn").addEventListener("click", () => {
  if (window.AndroidAdMob && window.AndroidAdMob.showRewardedHint) {
    try {
      window.AndroidAdMob.showRewardedHint(ADMOB_CONFIG.rewardedAdUnitId);
      return;
    } catch(e) {}
  }
  window.onRewardedHintGranted();
});

function traceBeam() {
  if (!state) return;
  const n = state.grid_size;
  const dirs = [[1,0],[0,1],[-1,0],[0,-1]];
  const reflect = { 1: {0:3,3:0,1:2,2:1}, 2: {0:1,1:0,2:3,3:2} };
  let cx = state.source.x, cy = state.source.y, d = state.source.dir;
  state.beamPath = [{x: cx, y: cy}];
  let hitTarget = false;

  for (let step=0; step < n * n * 2; step++) {
    cx += dirs[d][0]; cy += dirs[d][1];
    if (cx < 0 || cy < 0 || cx >= n || cy >= n) {
      state.beamPath.push({x: Math.max(0, Math.min(n-1, cx)), y: Math.max(0, Math.min(n-1, cy))});
      break;
    }
    state.beamPath.push({x: cx, y: cy});
    if (cx === state.target.x && cy === state.target.y) {
      hitTarget = true;
      break;
    }
    const m = state.mirrors.find(item => item.x === cx && item.y === cy);
    if (m) d = reflect[m.initial_type][d];
  }

  if (hitTarget && !solved && CATEGORY !== "mind_app") {
    triggerWin();
  }
}

function triggerWin() {
  solved = true;
  totalStars += 3;
  localStorage.setItem("neon_flow_3d_stars", String(totalStars));
  localStorage.setItem("neon_flow_3d_lv", String(curIdx + 1));
  document.getElementById("stars-num").textContent = totalStars;
  playTone(523.25, 0.15, "triangle");
  setTimeout(() => playTone(659.25, 0.15, "triangle"), 120);
  setTimeout(() => playTone(783.99, 0.28, "triangle"), 240);
  for (let i=0; i<48; i++) {
    particles.push({
      x: 360, y: 360,
      vx: (Math.random() - 0.5) * 14,
      vy: (Math.random() - 0.5) * 14,
      r: 4 + Math.random() * 6,
      life: 1.0
    });
  }
  if (window.AndroidAdMob && window.AndroidAdMob.onLevelComplete) {
    try { window.AndroidAdMob.onLevelComplete(curIdx + 1); } catch(e) {}
  }
  setTimeout(() => {
    document.getElementById("win-modal").classList.add("active");
  }, 550);
}

canvas.addEventListener("pointerdown", (ev) => {
  if (!state || solved) return;
  const rect = canvas.getBoundingClientRect();
  const px = (ev.clientX - rect.left) / rect.width * canvas.width;
  const py = (ev.clientY - rect.top) / rect.height * canvas.height;
  const n = state.grid_size;
  const pad = 60;
  const cell = (canvas.width - pad * 2) / n;
  const gx = Math.floor((px - pad) / cell);
  const gy = Math.floor((py - pad) / cell);
  if (gx < 0 || gy < 0 || gx >= n || gy >= n) return;

  if (CATEGORY === "mind_app") {
    if (performance.now() < state.revealUntil) return;
    const expected = state.seq[state.userStep];
    if (expected && expected.x === gx && expected.y === gy) {
      playTone(440 + state.userStep * 80, 0.12);
      state.userStep++;
      if (state.userStep >= state.seq.length) triggerWin();
    } else {
      playTone(180, 0.25, "sawtooth");
      state.userStep = 0;
      state.revealUntil = performance.now() + state.seq.length * 600 + 400;
    }
    return;
  }

  const m = state.mirrors.find(item => item.x === gx && item.y === gy);
  if (m) {
    m.initial_type = m.initial_type === 1 ? 2 : 1;
    state.show_finger_hint = false;
    playTone(580, 0.09, "sine");
    traceBeam();
  }
});

document.getElementById("next-btn").addEventListener("click", () => {
  curIdx++;
  loadLevel(curIdx);
});

function render(now) {
  animT = now * 0.001;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (state) {
    const n = state.grid_size;
    const pad = 60;
    const cell = (canvas.width - pad * 2) / n;

    for (let y=0; y<n; y++) {
      for (let x=0; x<n; x++) {
        const cx = pad + x * cell;
        const cy = pad + y * cell;
        ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
        ctx.strokeStyle = "rgba(34, 211, 238, 0.24)";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.roundRect(cx + 8, cy + 8, cell - 16, cell - 16, 18);
        ctx.fill();
        ctx.stroke();
      }
    }

    if (CATEGORY === "mind_app") {
      const elapsed = state.revealUntil - now;
      state.seq.forEach((pt, idx) => {
        const show = elapsed > 0 && Math.floor((state.seq.length * 650 - elapsed) / 650) === idx;
        const done = elapsed <= 0 && idx < state.userStep;
        if (show || done) {
          const cx = pad + (pt.x + 0.5) * cell;
          const cy = pad + (pt.y + 0.5) * cell;
          ctx.fillStyle = "rgb(16, 185, 129)";
          ctx.shadowColor = "rgb(16, 185, 129)";
          ctx.shadowBlur = 28;
          ctx.beginPath();
          ctx.arc(cx, cy, cell * 0.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      });
    } else {
      if (state.beamPath && state.beamPath.length > 1) {
        ctx.save();
        ctx.strokeStyle = "rgb(16, 185, 129)";
        ctx.shadowColor = "rgb(16, 185, 129)";
        ctx.shadowBlur = 24;
        ctx.lineWidth = 10;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        state.beamPath.forEach((pt, i) => {
          const bx = pad + (pt.x + 0.5) * cell;
          const by = pad + (pt.y + 0.5) * cell;
          if (i === 0) ctx.moveTo(bx, by);
          else ctx.lineTo(bx, by);
        });
        ctx.stroke();
        ctx.restore();
      }

      const sx = pad + (state.source.x + 0.5) * cell;
      const sy = pad + (state.source.y + 0.5) * cell;
      ctx.fillStyle = "rgb(16, 185, 129)";
      ctx.beginPath();
      ctx.arc(sx, sy, cell * 0.24, 0, Math.PI * 2);
      ctx.fill();

      const tx = pad + (state.target.x + 0.5) * cell;
      const ty = pad + (state.target.y + 0.5) * cell;
      const pulse = 1 + 0.1 * Math.sin(animT * 5);
      ctx.fillStyle = "rgb(34, 211, 238)";
      ctx.beginPath();
      ctx.arc(tx, ty, cell * 0.26 * pulse, 0, Math.PI * 2);
      ctx.fill();

      state.mirrors.forEach((m, idx) => {
        const mx = pad + (m.x + 0.5) * cell;
        const my = pad + (m.y + 0.5) * cell;
        const r = cell * 0.28;
        ctx.save();
        ctx.strokeStyle = "#ffffff";
        ctx.shadowColor = "rgb(34, 211, 238)";
        ctx.shadowBlur = 18;
        ctx.lineWidth = 9;
        ctx.lineCap = "round";
        ctx.beginPath();
        // NEON_CONDUIT_3D: 3D Rotary Star-Link Conduit Node
        ctx.arc(mx, my, r * 0.42, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        if (m.initial_type === 1) {
          ctx.moveTo(mx - r, my + r);
          ctx.lineTo(mx + r, my - r);
        } else {
          ctx.moveTo(mx - r, my - r);
          ctx.lineTo(mx + r, my + r);
        }
        ctx.stroke();
        ctx.restore();

        if (state.show_finger_hint && idx === 0) {
          const bounce = Math.sin(animT * 6) * 10;
          ctx.font = "48px Segoe UI Emoji";
          ctx.textAlign = "center";
          ctx.fillText("👆", mx + 12, my + 56 + bounce);
        }
      });
    }
  }

  particles = particles.filter(p => p.life > 0.02);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.life *= 0.94;
    ctx.fillStyle = `rgba(16, 185, 129, ${p.life})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });

  requestAnimationFrame(render);
}

loadLevel(curIdx);
requestAnimationFrame(render);
</script>
